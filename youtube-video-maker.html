<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a28"><title>YouTube動画作成</title><style>:root{--bg:#f2f4f7;--ink:#172033;--muted:#6d7788;--card:#fff;--line:#dce1e8;--red:#d94242;--blue:#263b6a;--green:#16705f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:780px;margin:auto}.head{padding:calc(20px + env(safe-area-inset-top)) 16px 20px;background:linear-gradient(160deg,#202a43,#111725);color:#fff}.head h1{margin:0;font-size:24px}.head p{margin:7px 0 0;color:#cbd2df;font-size:13px;line-height:1.55}main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 12px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;background:#fff;color:var(--ink)}textarea{min-height:100px;line-height:1.6;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.primary{width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;min-height:54px;font-size:16px;font-weight:900}.primary:disabled,.subbtn:disabled{opacity:.45}.subbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:var(--ink)}.green{background:var(--green);color:#fff;border:0}.blue{background:var(--blue);color:#fff;border:0}.status{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.6}.scene{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.sceneTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:11px;font-weight:900;background:#eef1f6;border-radius:999px;padding:5px 8px}.scene h3{font-size:16px;margin:8px 0}.pic{aspect-ratio:16/9;background:linear-gradient(135deg,#e9edf4,#d9dfeb);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#697386;font-size:13px;line-height:1.5;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;border-radius:8px}.note{font-size:12px;background:#fff8e6;border:1px solid #ead9ad;border-radius:10px;padding:10px;line-height:1.6;color:#66552b}.fact{font-size:12px;background:#f5f7fa;border-radius:9px;padding:9px;line-height:1.55;color:#596578;margin-top:8px}.toolbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.empty{color:var(--muted);font-size:13px;line-height:1.6}.projectTitle{font-size:21px;font-weight:900;margin-bottom:5px}.summary{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}.busy{animation:pulse 1s infinite alternate}@keyframes pulse{from{opacity:.45}to{opacity:1}}.audioState{font-size:12px;color:var(--muted);margin-top:7px}.previewWrap{display:none;margin-top:12px}.previewScreen{aspect-ratio:16/9;background:#111;border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.previewScreen img{width:100%;height:100%;object-fit:cover}.previewPlaceholder{color:#fff;font-size:13px;padding:20px;text-align:center}.subtitle{position:absolute;left:5%;right:5%;bottom:5%;background:rgba(0,0,0,.68);color:#fff;padding:8px 10px;border-radius:8px;text-align:center;font-size:clamp(13px,3vw,20px);font-weight:800;line-height:1.45;text-shadow:0 1px 2px #000}.previewMeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}audio{width:100%;margin-top:8px}</style></head><body><div class="app"><div class="head"><h1>🎬 YouTube動画作成</h1><p>テーマから台本・シーン構成・AIイラスト・AIナレーション・字幕付きプレビューまで作成。APIキー入力は不要です。</p></div><main><div class="card"><h2>1. 動画のテーマ</h2><input id="topic" placeholder="例：伊藤博文の人生"><div class="chips" style="margin-top:9px"><button class="chip" data-t="伊藤博文の人生">伊藤博文</button><button class="chip" data-t="ペニシリンはどうやって発見されたのか">ペニシリン</button><button class="chip" data-t="坂本龍馬の人生">坂本龍馬</button><button class="chip" data-t="天然痘ワクチンはどうやって生まれたのか">ワクチン</button></div><div class="row"><div><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="10">約10分</option></select></div><div><label>画風</label><select id="style"><option>歴史漫画・YouTube解説風</option><option>リアルな歴史画</option><option>ドキュメンタリー風</option><option>教科書図解風</option></select></div></div><div class="row"><div><label>AI音声</label><select id="voice"><option value="Kore">Kore（落ち着き）</option><option value="Charon">Charon（低め）</option><option value="Aoede">Aoede（柔らかめ）</option><option value="Puck">Puck（明るめ）</option></select></div><div><label>読み方</label><select id="tone"><option value="落ち着いた日本語のYouTubeドキュメンタリーナレーション。自然な間を取り、固有名詞を明瞭に読む。">落ち着いた解説</option><option value="テンポの良い日本語のYouTube解説。重要語を少し強調し、聞き取りやすく読む。">テンポ良い解説</option><option value="重厚で静かな歴史ドキュメンタリー調。急がず、年代と人名を明瞭に読む。">歴史ドキュメンタリー</option></select></div></div><label>追加の指示</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。人物を大きく。残酷な描写は避ける。"></textarea></div><div class="card"><button class="primary" id="make">AIで動画構成を作る</button><div class="status" id="status">テーマを入力して作成してください。</div></div><div class="card"><h2>2. 動画構成</h2><div id="result" class="empty">まだ作成していません。</div></div><div class="card previewWrap" id="previewWrap"><h2>3. 動画プレビュー</h2><div class="previewScreen" id="previewScreen"><div class="previewPlaceholder">画像とAIナレーションを作ると、ここで動画の流れを確認できます。</div><div class="subtitle" id="subtitle" style="display:none"></div></div><div class="previewMeta"><span id="previewScene">停止中</span><span id="previewTime"></span></div><div class="toolbar"><button class="subbtn blue" id="playPreview">▶︎ 最初から再生</button><button class="subbtn" id="stopPreview">■ 停止</button></div></div><div class="note">AI生成内容は下書きです。歴史・医学などは公開前に年代・固有名詞・因果関係を信頼できる資料で確認してください。</div></main></div><script>const $=x=>document.getElementById(x),FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/video-ai-gemini';let previewAudio=null,previewStopped=true;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.t});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}function pcmBase64ToWavUrl(b64,sampleRate=24000,channels=1){const raw=atob(b64),pcm=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)pcm[i]=raw.charCodeAt(i);const buffer=new ArrayBuffer(44+pcm.length),v=new DataView(buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.length,true);new Uint8Array(buffer,44).set(pcm);return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}))}function render(data){const arr=data.scenes||[];$('result').className='';$('result').innerHTML=`<div class="projectTitle">${esc(data.title||$('topic').value)}</div><div class="summary">${esc(data.summary||'')}</div><div class="toolbar"><button class="subbtn green" id="allImages">全シーンのAI画像を作る</button><button class="subbtn blue" id="allTts">全シーンのAIナレーションを作る</button><button class="subbtn" id="openPreview">動画プレビュー</button><button class="subbtn" id="saveJson">構成を保存</button></div>`+arr.map((x,i)=>`<div class="scene" data-i="${i}"><div class="sceneTop"><span class="badge">SCENE ${i+1}</span><span class="badge">約${Math.max(8,Math.round(Number($('minutes').value)*60/arr.length))}秒</span></div><h3 contenteditable="true">${esc(x.title)}</h3><div class="pic"><span>🖼️ まだ画像はありません</span></div><label>ナレーション</label><textarea class="nar">${esc(x.narration)}</textarea><div class="audioState">🔈 AI音声はまだありません</div><audio class="sceneAudio" controls style="display:none"></audio><label>画像生成指示</label><textarea class="imgPrompt">${esc(x.imagePrompt)}</textarea><div class="fact">史実確認メモ：${esc(x.factCheck||'要確認')}</div><div class="toolbar"><button class="subbtn green makeImg">AI画像を作る</button><button class="subbtn blue makeTts">AIナレーションを作る</button><button class="subbtn speak">端末音声で確認</button><button class="subbtn del">削除</button></div></div>`).join('');document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.closest('.scene').querySelector('.nar').value);u.lang='ja-JP';speechSynthesis.speak(u)});document.querySelectorAll('.del').forEach(b=>b.onclick=()=>b.closest('.scene').remove());document.querySelectorAll('.makeImg').forEach(b=>b.onclick=()=>makeImage(b));document.querySelectorAll('.makeTts').forEach(b=>b.onclick=()=>makeTts(b));$('allImages').onclick=makeAllImages;$('allTts').onclick=makeAllTts;$('openPreview').onclick=()=>{$('previewWrap').style.display='block';$('previewWrap').scrollIntoView({behavior:'smooth'})};$('saveJson').onclick=saveProject;$('previewWrap').style.display='block'}async function makeImage(btn){const scene=btn.closest('.scene'),prompt=scene.querySelector('.imgPrompt').value.trim(),pic=scene.querySelector('.pic');if(!prompt)return;btn.disabled=true;pic.innerHTML='<span class="busy">AI画像を生成中…</span>';try{const d=await api({action:'generateImage',prompt});const src=`data:${d.mimeType};base64,${d.data}`;pic.innerHTML=`<img alt="AI generated scene" src="${src}">`;pic.dataset.image=src}catch(e){pic.innerHTML=`<span>画像生成エラー<br>${esc(e.message)}</span>`}finally{btn.disabled=false}}async function makeAllImages(){const btn=$('allImages'),targets=[...document.querySelectorAll('.makeImg')];btn.disabled=true;for(let i=0;i<targets.length;i++){btn.textContent=`画像生成中 ${i+1}/${targets.length}`;if(!targets[i].closest('.scene').querySelector('.pic img'))await makeImage(targets[i])}btn.textContent='全シーンのAI画像を作る';btn.disabled=false}async function makeTts(btn){const scene=btn.closest('.scene'),text=scene.querySelector('.nar').value.trim(),audio=scene.querySelector('.sceneAudio'),state=scene.querySelector('.audioState');if(!text)return;btn.disabled=true;state.innerHTML='<span class="busy">AIナレーション生成中…</span>';try{const d=await api({action:'generateTts',text,voice:$('voice').value,direction:$('tone').value});if(audio.dataset.url)URL.revokeObjectURL(audio.dataset.url);const url=pcmBase64ToWavUrl(d.data,d.sampleRate||24000,d.channels||1);audio.src=url;audio.dataset.url=url;audio.style.display='block';state.textContent='✅ AIナレーション作成済み'}catch(e){state.textContent='音声生成エラー：'+e.message}finally{btn.disabled=false}}async function makeAllTts(){const btn=$('allTts'),targets=[...document.querySelectorAll('.makeTts')];btn.disabled=true;for(let i=0;i<targets.length;i++){btn.textContent=`音声生成中 ${i+1}/${targets.length}`;const audio=targets[i].closest('.scene').querySelector('.sceneAudio');if(!audio.src)await makeTts(targets[i])}btn.textContent='全シーンのAIナレーションを作る';btn.disabled=false}function saveProject(){const project={topic:$('topic').value,minutes:$('minutes').value,style:$('style').value,voice:$('voice').value,scenes:[...document.querySelectorAll('.scene')].map(s=>({title:s.querySelector('h3').innerText,narration:s.querySelector('.nar').value,imagePrompt:s.querySelector('.imgPrompt').value,image:s.querySelector('.pic').dataset.image||null,audioGenerated:!!s.querySelector('.sceneAudio').src}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}));a.download='youtube-video-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function playPreview(){stopPreview();const scenes=[...document.querySelectorAll('.scene')];if(!scenes.length)return;previewStopped=false;for(let i=0;i<scenes.length;i++){if(previewStopped)break;const s=scenes[i],img=s.querySelector('.pic img'),nar=s.querySelector('.nar').value.trim(),src=s.querySelector('.sceneAudio').src;$('previewScene').textContent=`SCENE ${i+1} / ${scenes.length}　${s.querySelector('h3').innerText}`;$('subtitle').style.display=nar?'block':'none';$('subtitle').textContent=nar;$('previewScreen').querySelectorAll('img').forEach(x=>x.remove());const ph=$('previewScreen').querySelector('.previewPlaceholder');if(ph)ph.remove();if(img){const p=document.createElement('img');p.src=img.src;$('previewScreen').prepend(p)}else{const p=document.createElement('div');p.className='previewPlaceholder';p.textContent='このシーンの画像はまだありません';$('previewScreen').prepend(p)}if(src){await new Promise(resolve=>{previewAudio=new Audio(src);previewAudio.onloadedmetadata=()=>{$('previewTime').textContent=`${Math.round(previewAudio.duration)}秒`};previewAudio.onended=resolve;previewAudio.onerror=resolve;previewAudio.play().catch(resolve)})}else{await new Promise(resolve=>setTimeout(resolve,Math.max(3500,nar.length*85)))} }if(!previewStopped)$('previewScene').textContent='再生終了';previewStopped=true}function stopPreview(){previewStopped=true;if(previewAudio){previewAudio.pause();previewAudio=null}$('previewTime').textContent=''}$('playPreview').onclick=playPreview;$('stopPreview').onclick=stopPreview;$('make').onclick=async()=>{const t=$('topic').value.trim();if(!t){$('status').textContent='テーマを入力してください。';return}$('make').disabled=true;$('status').textContent='AIが台本とシーン構成を作っています…';$('result').className='empty';$('result').textContent='生成中…';try{const d=await api({action:'generateScript',topic:t,minutes:Number($('minutes').value),style:$('style').value,extra:$('extra').value});render(d);$('status').textContent=`完成：${d.scenes?.length||0}シーン。次にAI画像とAIナレーションを作ると動画プレビューできます。`;$('result').scrollIntoView({behavior:'smooth'})}catch(e){$('result').textContent='生成できませんでした。';$('status').textContent='エラー：'+e.message}finally{$('make').disabled=false}};</script></body></html>
