<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a28"><title>YouTube動画作成</title><style>:root{--bg:#f2f4f7;--ink:#172033;--muted:#6d7788;--card:#fff;--line:#dce1e8;--red:#d94242;--blue:#263b6a;--green:#16705f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:780px;margin:auto}.head{padding:calc(20px + env(safe-area-inset-top)) 16px 20px;background:linear-gradient(160deg,#202a43,#111725);color:#fff}.head h1{margin:0;font-size:24px}.head p{margin:7px 0 0;color:#cbd2df;font-size:13px;line-height:1.55}main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 12px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;background:#fff;color:var(--ink)}textarea{min-height:100px;line-height:1.6;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.primary{width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;min-height:54px;font-size:16px;font-weight:900}.primary:disabled,.subbtn:disabled{opacity:.45}.subbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:var(--ink)}.green{background:var(--green);color:#fff;border:0}.blue{background:var(--blue);color:#fff;border:0}.status{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.6}.scene{border:1px s n value="Iapetus">Iapetus｜明瞭</option><option value="Algieba">Algieba｜滑らか</option><option value="Schedar">Schedar｜均整・安定</option><option value="Kore">Kore｜引き締まった声</option><option value="Aoede">Aoede｜軽やか</option><option value="Sulafat">Sulafat｜温かい</option><option value="Vindemiatrix">Vindemiatrix｜穏やか</option><option value="Achernar">Achernar｜柔らかい</option><option value="Puck">Puck｜明るくテンポ良い</option></select><button class="subbtn" id="previewVoice" type="button" style="margin-top:7px;width:100%">▶︎ この声を試聴</button><div class="audioState" id="voicePreviewState">同じ文章で声を聞き比べできます。</div><audio id="voicePreviewAudio" controls style="display:none"></audio></div><div><label>読み方</label><select id="tone"><option value="落ち着いた日本語のYouTubeドキュメンタリーナレーション。自然な間を取り、固有名詞を明瞭に読む。">落ち着いた解説</option><option value="テンポの良い日本語のYouTube解説。重要語を少し強調し、聞き取りやすく読む。">テンポ良い解説</option><option value="重厚で静かな歴史ドキュメンタリー調。急がず、年代と人名を明瞭に読む。">歴史ドキュメンタリー</option></select></div></div><label>追加の指示</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。人物を大きく。残酷な描写は避ける。"></textarea></div><div class="card"><button class="primary" id="make">AIで動画構成を作る</button><div class="status" id="status">テーマを入力して作成してください。</div></div><div class="card"><h2>2. 動画構成</h2><div id="result" class="empty">まだ作成していません。</div></div><div class="card previewWrap" id="previewWrap"><h2>3. 動画プレビュー・書き出し</h2><div class="previewScreen" id="previewScreen"><div class="previewPlaceholder">画像とAIナレーションを作ると、ここで動画の流れを確認できます。</div></div><div class="previewMeta"><span id="previewScene">停止中</span><span id="previewTime"></span></div><div class="toolbar"><button class="subbtn blue" id="playPreview">▶︎ 最初から再生</button><button class="subbtn" id="stopPreview">■ 停止</button></div><div class="exportBox"><label>書き出し品質</label><select id="exportSize"><option value="1280x720">HD 720p（おすすめ）</option><option value="1920x1080">Full HD 1080p</option></select><button class="primary" id="exportVideo" style="margin-top:10px">🎞️ 動画を書き出す</button><div class="status" id="exportStatus">全シーンの画像とAIナレーションを作成してから書き出してください。</div><div class="progress"><div class="bar" id="exportBar"></div></div><a class="download" id="downloadVideo">完成した動画を保存</a></div></div><div class="note">AI生成内容は下書きです。歴史・医学などは公開前に年代・固有名詞・因果関係を信頼できる資料で確認してください。</div></main></div><script>const $=x=>document.getElementById(x),FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/video-ai-gemini';let previewAudio=null,previewStopped=true,exportUrl='';document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.t});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}async function api(body,attempt=0){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(_){if(!r.ok)throw new Error(`HTTP ${r.status}`);throw new Error('AI response was not valid JSON')}if(!r.ok){const msg=d.error||`HTTP ${r.status}`;if(body?.action==='generateScript'&&/json/i.test(String(msg))&&attempt<2){$('status').textContent=`AIの出力形式を整えて再試行しています…（${attempt+2}/3）`;await new Promise(res=>setTimeout(res,700*(attempt+1)));return api({...body,extra:[body.extra||'','出力は必ず有効なJSONだけにしてください。'].filter(Boolean).join('\n')},attempt+1)}throw new Error(msg)}return d}function pcmBase64ToWavUrl(b64,sampleRate=24000,channels=1){const raw=atob(b64),pcm=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)pcm[i]=raw.charCodeAt(i);const buffer=new ArrayBuffer(44+pcm.length),v=new DataView(buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.length,true);new Uint8Array(buffer,44).set(pcm);return URL.createObjectURL(ne
