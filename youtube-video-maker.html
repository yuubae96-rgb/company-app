<style>

0}.beginnerBox strong{display:block;font-size:15px;color:var(--ink)}.beginnerBox span{display:block;font-size:12px;color:var(--muted);line-height:1.55;margin-top:3px}.scene{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.sceneTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:11px;font-weight:900;background:#eef1f6;border-radius:999px;padding:5px 8px}.scene h3{font-size:16px;margin:8px 0}.pic{aspect-ratio:16/9;background:linear-gradient(135deg,#e9edf4,#d9dfeb);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#697386;font-size:13px;line-height:1.5;overflow:hidden;position:relative}.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sceneLabel{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,193,7,.72);color:#fff;border-radius:6px;padding:4px 6px;font-size:7px;font-weight:900;line-height:1.3;max-width:78%;text-align:left;text-shadow:0 1px 3px #000}.note{font-size:12px;background:#fff8e6;border:1px solid #ead9ad;border-radius:10px;padding:10px;line-height:1.6;color:#66552b}.fact{font-size:12px;background:#f5f7fa;border-radius:9px;padding:9px;line-height:1.55;color:#596578;margin-top:8px}.toolbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.empty{color:var(--muted);font-size:13px;line-height:1.6}.projectTitle{font-size:21px;font-weight:900;margin-bottom:5px}.summary{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}.busy{animation:pulse 1s infinite alternate}@keyframes pulse{from{opacity:.45}to{opacity:1}}.audioState{font-size:12px;color:var(--muted);margin-top:7px}.readingHelp{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.ttsNar{min-height:72px;background:#f8f9fc}.previewWrap{display:none}.previewScreen{aspect-ratio:16/9;background:#111;border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.previewScreen img{width:100%;height:100%;object-fit:cover}.previewPlaceholder{color:#fff;font-size:13px;padding:20px;text-align:center}.previewTitle{position:absolute;left:4%;top:5%;background:rgba(255,193,7,.72);color:#fff;padding:4px 7px;border-radius:6px;font-size:clamp(7px,1.6vw,12px);font-weight:900;text-shadow:0 1px 3px #000;max-width:76%}.subtitle{position:absolute;left:7%;right:7%;bottom:5%;background:rgba(0,0,0,.58);color:#fff;padding:5px 7px;border-radius:6px;text-align:center;font-size:clamp(7px,1.5vw,10px);font-weight:800;line-height:1.4;text-shadow:0 1px 2px #000;white-space:pre-line}.previewMeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}audio{width:100%;margin-top:8px}.exportBox{margin-top:12px;padding:12px;background:#f6f8fb;border:1px solid var(--line);border-radius:12px}.exportBox .primary{background:#111d38}.progress{height:8px;background:#e1e5eb;border-radius:999px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:#16705f;transition:width .2s}.download{display:none;margin-top:10px;text-align:center;text-decoration:none;background:#16705f;color:#fff;padding:13px;border-radius:11px;font-weight:900}@media(max-width:560px){.row{grid-template-columns:1fr}.voiceActions{grid-template-columns:1fr 1fr}.voiceActions .subbtn{font-size:12px;padding:8px 6px}}

<body><div class="app"><div class="head"><h1>🎬 YouTube動画作成</h1><p>テーマから台本・AIイラスト・AIナレーション・字幕付き動画まで作成。APIキー入力は不要です。</p></div><main>
<div class="card"><h2>1. 動画のテーマ</h2><input id="topic" placeholder="例：伊藤博文の人生"><div class="chips" style="margin-top:9px"><button class="chip" data-t="伊藤博文の人生">伊藤博文</button><button class="chip" data-t="ペニシリンはどうやって発見されたのか">ペニシリン</button><button class="chip" data-t="坂本龍馬の人生">坂本龍馬</button><button class="chip" data-t="天然痘ワクチンはどうやって生まれたのか">ワクチン</button></div>
<div class="row"><div><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="10">約10分</option></select></div><div><label>画風</label><select id="style"><option>歴史漫画・YouTube解説風</option><option>リアルな歴史画</option><option>ドキュメンタリー風</option><option>教科書図解風</option></select></div></div>
<div class="row"><div><label>ナレーションの声（12種類）</label><select id="voice"><option value="Charon">Charon｜情報的・解説向き</option><option value="Gacrux">Gacrux｜成熟した声</option><option value="Sadaltager">Sadaltager｜知的・落ち着き</option><option value="Iapetus">Iapetus｜明瞭</option><option value="Algieba">Algieba｜滑らか</option><option value="Schedar">Schedar｜均整・安定</option><option value="Kore">Kore｜引き締まった声</option><option value="Aoede">Aoede｜軽やか</option><option value="Sulafat">Sulafat｜温かい</option><option value="Vindemiatrix">Vindemiatrix｜穏やか</option><option value="Achernar">Achernar｜柔らかい</option><option value="Puck">Puck｜明るくテンポ良い</option></select><div class="voiceActions"><button class="subbtn" id="previewVoice" type="button">▶︎ この声を試聴</button><button class="subbtn" id="replaceAllVoiceTop" type="button" disabled>🔄 選択中の声で全場面を作り直す</button></div><div class="audioState" id="voicePreviewState">同じ文章で声を聞き比べできます。</div><audio id="voicePreviewAudio" controls style="display:none"></audio></div><div><label>読み方</label><select id="tone"><option value="落ち着いた日本語のYouTubeドキュメンタリーナレーション。自然な間を取り、固有名詞を明瞭に読む。">落ち着いた解説</option><option value="テンポの良い日本語のYouTube解説。重要語を少し強調し、聞き取りやすく読む。">テンポ良い解説</option><option value="重厚で静かな歴史ドキュメンタリー調。急がず、年代と人名を明瞭に読む。">歴史ドキュメンタリー</option></select></div></div>
<label class="beginnerBox"><input type="checkbox" id="beginner"><span><strong>初心者向け</strong><span>チェックするだけで、専門用語をかみ砕き、前提知識がない人にも分かる構成・説明にします。</span></span></label>
<label>追加の指示</label><textarea id="extra" placeholder="必要な時だけ入力。例：人物を大きく。残酷な描写は避ける。"></textarea></div>
<div class="card"><button class="primary" id="make">AIで動画構成を作る</button><div class="status" id="status">テーマを入力して作成してください。</div></div>
<div class="card"><h2>2. 動画構成</h2><div id="result" class="empty">まだ作成していません。</div></div>
<div class="card previewWrap" id="previewWrap"><h2>3. 動画プレビュー・書き出し</h2><div class="previewScreen" id="previewScreen"><div class="previewPlaceholder">画像とAIナレーションを作ると、ここで動画の流れを確認できます。</div></div><div class="previewMeta"><span id="previewScene">停止中</span><span id="previewTime"></span></div><div class="toolbar"><button class="subbtn blue" id="playPreview">▶︎ 最初から再生</button><button class="subbtn" id="stopPreview">■ 停止</button></div><div class="exportBox"><label>書き出し品質</label><select id="exportSize"><option value="1280x720">HD 720p（おすすめ）</option><option value="1920x1080">Full HD 1080p</option></select><button class="primary" id="exportVideo" style="margin-top:10px">🎞️ 動画を書き出す</button><div class="status" id="exportStatus">全シーンの画像とAIナレーションを作成してから書き出してください。</div><div class="progress"><div class="bar" id="exportBar"></div></div><a class="download" id="downloadVideo">完成した動画を保存</a></div></div>
<div class="note">AI生成内容は下書きです。歴史・医学などは公開前に年代・固有名詞・因果関係を信頼できる資料で確認してください。</div>
</main></div>
<script>
const $=x=>document.getElementById(x),FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/video-ai-gemini';let previewAudio=null,previewStopped=true,exportUrl='';
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.t});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function api(body,attempt=0){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(_){if(!r.ok)throw new Error(`HTTP ${r.status}`);throw new Error('AI response was not valid JSON')}if(!r.ok){const msg=d.error||`HTTP ${r.status}`;if(body?.action==='generateScript'&&/json/i.test(String(msg))&&attempt<2){$('status').textContent=`AIの出力形式を整えて再試行しています…（${attempt+2}/3）`;await wait(700*(attempt+1));return api({...body,extra:[body.extra||'','出力は必ず有効なJSONだけにしてください。'].filter(Boolean).join('\n')},attempt+1)}throw new Error(msg)}return d}
function pcmBase64ToWavUrl(b64,sampleRate=24000,channels=1){const raw=atob(b64),pcm=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)pcm[i]=raw.charCodeAt(i);const buffer=new ArrayBuffer(44+pcm.length),v=new DataView(buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.length,true);new Uint8Array(buffer,44).set(pcm);return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}))}
async function generateTts(text,voice,tone){const d=await api({action:'generateTts',text,voice,tone});return pcmBase64ToWavUrl(d.data,d.sampleRate||24000,d.channels||1)}
$('previewVoice').onclick=async()=>{const b=$('previewVoice'),s=$('voicePreviewState'),a=$('voicePreviewAudio');b.disabled=true;s.textContent='試聴音声を作成中…';try{const u=await generateTts('こんにちは。今日は歴史の出来事を、分かりやすく解説します。',$('voice').value,$('tone').value);a.src=u;a.style.display='block';await a.play();s.textContent=`${$('voice').selectedOptions[0].textContent} を再生中です。`}catch(e){s.textContent='試聴エラー: '+e.message}finally{b.disabled=false}};
$('make').onclick=async()=>{const topic=$('topic').value.trim();if(!topic){$('status').textContent='テーマを入力してください。';return}const b=$('make');b.disabled=true;b.classList.add('busy');$('status').textContent='AIが動画構成を作成中…';$('result').className='empty';$('result').textContent='構成を作成しています。完成するまで次の操作はしません。';try{const beginner=$('beginner').checked;const beginnerInstruction=beginner?'【初心者向け】前提知識ゼロの人を対象にする。難しい専門用語はできるだけ避け、必要な用語はその場で短く説明する。1文を短くし、出来事の原因→何が起きたか→結果の順で分かりやすく説明する。人物・組織・制度は初登場時に簡単に紹介し、知識を前提に話を進めない。': '';const extra=[beginnerInstruction,$('extra').value.trim()].filter(Boolean).join('\n');const d=await api({action:'generateScript',topic,minutes:$('minutes').value,style:$('style').value,tone:$('tone').value,extra});render(d)}catch(e){$('result').textContent='作成できませんでした。';$('status').textContent='エラー: '+e.message}finally{b.disabled=false;b.classList.remove('busy')}};
function render(d){const scenes=Array.isArray(d.scenes)?d.scenes:[];$('result').className='';$('result').innerHTML=`<div class="projectTitle">${esc(d.title||$('topic').value)}</div><div class="summary">${esc(d.summary||'')}</div><div class="toolbar"><button class="subbtn green" id="allImg">全シーンのAI画像を作る</button><button class="subbtn blue" id="allTts">全シーンのAIナレーションを作る</button></div><div class="audioState" id="allVoiceState">声を変更したら、上の「選択中の声で全場面を作り直す」で一括変更できます。</div>`+scenes.map((s,i)=>`<div class="scene" data-i="${i}"><div class="sceneTop"><span class="badge">SCENE ${i+1}</span><span class="badge">${esc(s.seconds||'')}秒</span></div><h3>${esc(s.title||'')}</h3><div class="pic" id="pic${i}"><span>${esc(s.visual||s.imagePrompt||'AI画像を作成してください')}</span><span class="sceneLabel">${esc(s.title||'')}</span></div><label>ナレーション（字幕に表示する文章）</label><textarea class="nar">${esc(s.narration||'')}</textarea><label>音声用の読み方（必要な時だけ）</label><textarea class="ttsNar">${esc(s.ttsNarration||s.narration||'')}</textarea><div class="readingHelp">最初はナレーションと同じ文章が入っています。読み間違える部分だけ直してください。字幕の文章は変わりません。</div><label>画像指示</label><textarea class="prompt">${esc(s.imagePrompt||s.visual||'')}</textarea><div class="fact">確認ポイント：${esc(s.factCheck||'年代・固有名詞・因果関係を公開前に確認')}</div><div class="toolbar"><button class="subbtn imgBtn">AI画像を作る</button><button class="subbtn ttsBtn">AIナレーションを作る</button></div><div class="audioState" id="audioState${i}">ナレーション未作成</div><audio id="audio${i}" controls style="display:none"></audio></div>`).join('');$('status').textContent=`構成が完成しました。${scenes.length}シーンです。内容を確認してから画像・音声を作ってください。`;$('previewWrap').style.display='block';$('replaceAllVoiceTop').disabled=scenes.length===0;document.querySelectorAll('.imgBtn').forEach((b,i)=>b.onclick=()=>makeImage(i,b));document.querySelectorAll('.ttsBtn').forEach((b,i)=>b.onclick=()=>makeAudio(i,b));$('allImg').onclick=async()=>{const b=$('allImg');b.disabled=true;for(let i=0;i<scenes.length;i++){const btn=document.querySelectorAll('.imgBtn')[i];if(!$(`pic${i}`).dataset.image)await makeImage(i,btn)}b.disabled=false};$('allTts').onclick=async()=>{const b=$('allTts');b.disabled=true;for(let i=0;i<scenes.length;i++){const btn=document.querySelectorAll('.ttsBtn')[i];if(!$(`audio${i}`).src)await makeAudio(i,btn)}b.disabled=false}}
async function rebuildAllVoices(){const scenes=[...document.querySelectorAll('.scene')];if(!scenes.length){$('voicePreviewState').textContent='先に動画構成を作ってください。';return}const b=$('replaceAllVoiceTop'),voiceName=$('voice').selectedOptions[0].textContent,state=$('allVoiceState');b.disabled=true;if($('allTts'))$('allTts').disabled=true;if(state)state.textContent=`${voiceName} で全シーンを作り直しています…`;try{for(let i=0;i<scenes.length;i++){await makeAudio(i,document.querySelectorAll('.ttsBtn')[i])}if(state)state.textContent=`全シーンを ${voiceName} に変更しました。`;$('voicePreviewState').textContent=`全シーンを ${voiceName} に変更しました。`}catch(e){if(state)state.textContent='一括変更エラー: '+e.message}finally{b.disabled=false;if($('allTts'))$('allTts').disabled=false}}
$('replaceAllVoiceTop').onclick=rebuildAllVoices;
async function makeImage(i,b){const scene=b.closest('.scene'),p=scene.querySelector('.prompt').value.trim(),pic=$(`pic${i}`);if(!p)return;b.disabled=true;b.textContent='画像作成中…';try{let referenceImage='';if(i>0){const prev=$(`pic${i-1}`)?.dataset.image||'';if(prev)referenceImage=prev}const d=await api({action:'generateImage',prompt:p,style:$('style').value,topic:$('topic').value,sceneIndex:i+1,referenceImage});const src=`data:${d.mimeType||'image/png'};base64,${d.data}`;pic.dataset.image=src;pic.innerHTML=`<img src="${src}" alt="scene"><span class="sceneLabel">${esc(scene.querySelector('h3').textContent)}</span>`;b.textContent='画像を作り直す'}catch(e){b.textContent='画像エラー: '+e.message}finally{b.disabled=false}}
async function makeAudio(i,b){const scene=b.closest('.scene'),displayText=scene.querySelector('.nar').value.trim(),ttsText=scene.querySelector('.ttsNar')?.value.trim()||displayText,a=$(`audio${i}`),st=$(`audioState${i}`);if(!displayText||!ttsText)return;b.disabled=true;b.textContent='音声作成中…';st.textContent='AIナレーションを生成しています…';try{const u=await generateTts(ttsText,$('voice').value,$('tone').value);a.src=u;a.style.display='block';a.dataset.subtitle=displayText;a.dataset.ttsText=ttsText;st.textContent=`完成：${$('voice').selectedOptions[0].textContent}${ttsText!==displayText?'（読み方修正あり）':''}`;b.textContent='音声を作り直す'}catch(e){st.textContent='音声エラー: '+e.message;b.textContent='AIナレーションを作る'}finally{b.disabled=false}}
function subtitleChunks(text,maxLine=24){const clean=String(text||'').replace(/\s+/g,' ').trim();if(!clean)return[''];const parts=clean.match(/[^。、！？!?]+[。、！？!?]?/g)||[clean],chunks=[];let current='';const pushLong=s=>{let rest=s;while(rest.length>maxLine*2){chunks.push(rest.slice(0,maxLine)+'\n'+rest.slice(maxLine,maxLine*2));rest=rest.slice(maxLine*2)}if(rest)chunks.push(rest.length>maxLine?rest.slice(0,maxLine)+'\n'+rest.slice(maxLine):rest)};for(const p0 of parts){const p=p0.trim();if(!p)continue;if(p.length>maxLine*2){if(current){pushLong(current);current=''}pushLong(p);continue}if((current+p).length<=maxLine*2)current+=p;else{if(current)pushLong(current);current=p}}if(current)pushLong(current);return chunks.length?chunks:['']}
function subtitleAt(text,elapsed,duration){const chunks=subtitleChunks(text),weights=chunks.map(x=>Math.max(1,x.replace(/\n/g,'').length)),total=weights.reduce((a,b)=>a+b,0),pos=Math.max(0,Math.min(1,duration?elapsed/duration:0))*total;let acc=0;for(let i=0;i<chunks.length;i++){acc+=weights[i];if(pos<=acc)return chunks[i]}return chunks[chunks.length-1]}
function getScenesReady(){return [...document.querySelectorAll('.scene')].map((s,i)=>({title:s.querySelector('h3').textContent,text:s.querySelector('.nar').value.trim(),image:$(`pic${i}`).dataset.image||'',audio:$(`audio${i}`).src||''}))}
function stopPreview(){previewStopped=true;if(previewAudio){previewAudio.pause();previewAudio=null}$('previewScene').textContent='停止中';$('previewTime').textContent=''}$('stopPreview').onclick=stopPreview;
$('playPreview').onclick=async()=>{stopPreview();const list=getScenesReady();if(!list.length)return;previewStopped=false;for(let i=0;i<list.length&&!previewStopped;i++){const s=list[i],screen=$('previewScreen');screen.innerHTML=s.image?`<img src="${s.image}"><div class="previewTitle">${esc(s.title)}</div><div class="subtitle"></div>`:`<div class="previewPlaceholder">SCENE ${i+1}<br>${esc(s.title)}<div class="subtitle"></div></div>`;$('previewScene').textContent=`SCENE ${i+1} / ${list.length}`;const sub=screen.querySelector('.subtitle');if(s.audio){previewAudio=new Audio(s.audio);let dur=0;const update=()=>{dur=previewAudio.duration||dur||1;sub.textContent=subtitleAt(s.text,previewAudio.currentTime,dur);$('previewTime').textContent=`${previewAudio.currentTime.toFixed(1)} / ${dur.toFixed(1)}秒`};previewAudio.addEventListener('timeupdate',update);const timer=setInterval(update,120);try{await previewAudio.play();await new Promise(res=>{previewAudio.onended=res})}catch(_){await wait(3500)}clearInterval(timer)}else{const dur=Math.max(3,Math.min(12,s.text.length*.11)),start=performance.now();while(!previewStopped&&(performance.now()-start)/1000<dur){const el=(performance.now()-start)/1000;sub.textContent=subtitleAt(s.text,el,dur);$('previewTime').textContent=`${el.toFixed(1)} / ${dur.toFixed(1)}秒`;await wait(120)}}}if(!previewStopped)stopPreview()};
function loadImage(src){return new Promise((res,rej)=>{const im=new Image;im.onload=()=>res(im);im.onerror=rej;im.src=src})}function drawCover(ctx,img,w,h){const ir=img.width/img.height,cr=w/h;let sw,sh,sx,sy;if(ir>cr){sh=img.height;sw=sh*cr;sx=(img.width-sw)/2;sy=0}else{sw=img.width;sh=sw/cr;sx=0;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h)}function once(el,event){return new Promise(res=>el.addEventListener(event,res,{once:true}))}
$('exportVideo').onclick=async()=>{const btn=$('exportVideo'),status=$('exportStatus'),bar=$('exportBar'),dl=$('downloadVideo'),list=getScenesReady();if(!list.length||list.some(s=>!s.image||!s.audio)){status.textContent='全シーンのAI画像とAIナレーションを先に作成してください。';return}if(!window.MediaRecorder){status.textContent='このブラウザは動画書き出しに対応していません。';return}btn.disabled=true;dl.style.display='none';bar.style.width='0%';status.textContent='動画を書き出す準備中…';if(exportUrl){URL.revokeObjectURL(exportUrl);exportUrl=''}try{const [w,h]=$('exportSize').value.split('x').map(Number),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d'),stream=canvas.captureStream(30),audioCtx=new (window.AudioContext||window.webkitAudioContext)(),dest=audioCtx.createMediaStreamDestination();dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:w>=1920?9000000:5000000}:{videoBitsPerSecond:5000000}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(1000);for(let i=0;i<list.length;i++){const s=list[i],img=await loadImage(s.image),a=new Audio(s.audio);a.preload='auto';if(a.readyState<1)await once(a,'loadedmetadata');const source=audioCtx.createMediaElementSource(a);source.connect(dest);source.connect(audioCtx.destination);await audioCtx.resume();let ended=false;a.onended=()=>ended=true;await a.play();while(!ended){drawCover(ctx,img,w,h);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(w*.06,h*.82,w*.88,h*.12);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`800 ${Math.max(18,Math.round(h*.028))}px sans-serif`;ctx.fillText(subtitleAt(s.text,a.currentTime,a.duration||1).replace(/\n/g,' '),w/2,h*.875,w*.82);ctx.textAlign='left';bar.style.width=`${((i+Math.min(1,a.currentTime/(a.duration||1)))/list.length)*100}%`;await new Promise(r=>requestAnimationFrame(r))}source.disconnect()}rec.stop();await once(rec,'stop');const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});exportUrl=URL.createObjectURL(blob);dl.href=exportUrl;dl.download=`${($('topic').value||'youtube-video').replace(/[\\/:*?"<>|]/g,'_')}.webm`;dl.style.display='block';dl.textContent=`完成した動画を保存（${(blob.size/1024/1024).toFixed(1)}MB）`;bar.style.width='100%';status.textContent='動画が完成しました。下のボタンから保存できます。'}catch(e){status.textContent='書き出しエラー: '+e.message}finally{btn.disabled=false}};
</script></body></html>
