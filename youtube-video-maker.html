<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a28"><title>YouTube動画作成</title><style>:root{--bg:#f2f4f7;--ink:#172033;--muted:#6d7788;--card:#fff;--line:#dce1e8;--red:#d94242;--blue:#263b6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:760px;margin:auto}.head{padding:calc(20px + env(safe-area-inset-top)) 16px 20px;background:linear-gradient(160deg,#202a43,#111725);color:white}.head h1{margin:0;font-size:24px}.head p{margin:7px 0 0;color:#cbd2df;font-size:13px;line-height:1.55}main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 12px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;background:#fff;color:var(--ink)}textarea{min-height:100px;line-height:1.6;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.primary{width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;min-height:54px;font-size:16px;font-weight:900}.primary:disabled{opacity:.45}.subbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:var(--ink)}.status{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.6}.scene{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.sceneTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:11px;font-weight:900;background:#eef1f6;border-radius:999px;padding:5px 8px}.scene h3{font-size:16px;margin:8px 0}.scene .pic{aspect-ratio:16/9;background:linear-gradient(135deg,#e9edf4,#d9dfeb);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#697386;font-size:13px;line-height:1.5}.note{font-size:12px;background:#fff8e6;border:1px solid #ead9ad;border-radius:10px;padding:10px;line-height:1.6;color:#66552b}.hide{display:none}.toolbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.empty{color:var(--muted);font-size:13px;line-height:1.6}</style></head><body><div class="app"><div class="head"><h1>🎬 YouTube動画作成</h1><p>テーマから台本・シーン構成・イラスト指示・ナレーションまで、1本の動画として組み立てます。</p></div><main><div class="card"><h2>1. 動画のテーマ</h2><input id="topic" placeholder="例：伊藤博文の人生"><div class="chips" style="margin-top:9px"><button class="chip" data-t="伊藤博文の人生">伊藤博文</button><button class="chip" data-t="ペニシリンはどうやって発見されたのか">ペニシリン</button></div><div class="row"><div><label>動画の長さ</label><select id="minutes"><option value="1">約1分</option><option value="3" selected>約3分</option><option value="5">約5分</option><option value="10">約10分</option></select></div><div><label>画風</label><select id="style"><option>歴史漫画・YouTube解説風</option><option>リアルな歴史画</option><option>ドキュメンタリー風</option><option>教科書図解風</option></select></div></div><label>追加の指示</label><textarea id="extra" placeholder="例：初心者にも分かりやすく。人物を大きく。文字は画像に入れない。"></textarea></div><div class="card"><button class="primary" id="make">動画構成を作る</button><div class="status" id="status">まずは試作版です。テーマを入れると編集可能な動画構成を作ります。</div></div><div class="card"><h2>2. 動画構成</h2><div id="result" class="empty">まだ作成していません。</div></div><div class="note">歴史・医学などは、公開前に年代・固有名詞・因果関係を一次資料や信頼できる資料で確認してください。完成版では「史実確認」工程を独立させます。</div></main></div><script>const $=x=>document.getElementById(x);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('topic').value=b.dataset.t});const presets={"伊藤博文の人生":[["幕末の長州に生まれる","1841年、長州藩で生まれた伊藤博文。若き日は幕末の激動の中にいました。","幕末の長州、若き伊藤博文を中心に、木造家屋と武士たち、緊張感ある歴史漫画、16:9"],["英国へ密航","長州五傑の一人として英国へ渡り、西洋の国力を目の当たりにします。","1860年代ロンドン、若い日本人留学生、蒸気機関と街並み、驚きの表情、歴史漫画、16:9"],["明治政府の中心へ","帰国後、新政府で頭角を現し、近代国家づくりの中心人物になっていきます。","明治初期の政府会議、日本人政治家たち、洋装と和装が混在、伊藤博文を中心、16:9"],["憲法調査と内閣制度","欧州で憲法制度を調査し、1885年には初代内閣総理大臣となりました。","明治時代の官邸風室内、初代首相となる伊藤博文、重厚な歴史画、16:9"],["大日本帝国憲法","1889年、大日本帝国憲法が発布され、日本の近代国家制度が形づくられていきます。","明治憲法発布式を想起させる壮麗な宮廷空間、多数の官僚、歴史漫画、16:9"],["韓国統監へ","その後、韓国統監を務めるなど、日本の対外政策にも深く関わりました。","20世紀初頭の東アジア外交、伊藤博文と官僚、地図を背景にしたドキュメンタリー調、16:9"],["ハルビンで暗殺","1909年、ハルビン駅で安重根に撃たれ、68年の生涯を閉じました。","1909年ハルビン駅、冬の駅舎、群衆と伊藤博文、事件直前の緊張感、流血なし、16:9"]],"ペニシリンはどうやって発見されたのか":[["1928年 ロンドン","細菌学者アレクサンダー・フレミングは、ブドウ球菌を培養していました。","1928年ロンドンの細菌学研究室、白衣のフレミング、培養皿、リアルな科学史イラスト、16:9"],["培養皿にカビ","培養皿の一部にカビが生え、その周囲では細菌が増えていないことに気づきます。","培養皿のクローズアップ、中央に青緑色のカビ、周囲だけ細菌が少ない、科学図解、16:9"],["偶然を見逃さなかった","重要だったのは、汚染された皿を捨てず、その現象を観察したことでした。","培養皿を光にかざして観察するフレミング、発見の瞬間、映画的照明、16:9"],["ペニシリンと命名","フレミングはカビが作る抗菌物質を研究し、ペニシリンと名付けました。","研究ノートと顕微鏡、ペニシリウムのイメージ、1920年代研究室、16:9"],["薬にするのは別の難題","ただし、発見しただけでは薬にはできません。安定して精製・大量生産する技術が必要でした。","実験器具と少量の薬液、研究者が苦戦する様子、科学史ドキュメンタリー、16:9"],["フローリーとチェーン","後にハワード・フローリーやエルンスト・チェーンらが研究を進め、治療薬としての実用化へ大きく前進させます。","1940年代オックスフォードの研究室、複数の科学者、実験装置、リアル、16:9"],["抗生物質の時代へ","ペニシリンは感染症治療を大きく変え、抗生物質の時代を開く象徴的な薬となりました。","1940年代の病院と現代医療へつながる光の演出、希望を感じる科学史イラスト、16:9"]]};function generic(topic,n){const a=[];for(let i=1;i<=n;i++)a.push([`${i}. ${topic} — シーン${i}`,`ここに${topic}の第${i}場面のナレーションを入れます。AI連携後は史実を確認しながら自動生成します。`,`${topic}、場面${i}、${$('style').value}、人物や出来事を大きく、画像内文字なし、16:9`]);return a}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(arr){$('result').className='';$('result').innerHTML=arr.map((x,i)=>`<div class="scene"><div class="sceneTop"><span class="badge">SCENE ${i+1}</span><span class="badge">約${Math.max(8,Math.round(Number($('minutes').value)*60/arr.length))}秒</span></div><h3 contenteditable="true">${esc(x[0])}</h3><div class="pic">🖼️ イラスト生成予定<br>${esc(x[2])}</div><label>ナレーション</label><textarea>${esc(x[1])}</textarea><label>画像生成指示</label><textarea>${esc(x[2])}</textarea><div class="toolbar"><button class="subbtn" onclick="speak(this)">▶︎ ナレーション確認</button><button class="subbtn" onclick="this.closest('.scene').remove()">削除</button></div></div>`).join('')}window.speak=b=>{speechSynthesis.cancel();const t=b.closest('.scene').querySelector('textarea').value,u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.speak(u)};$('make').onclick=()=>{const t=$('topic').value.trim();if(!t){$('status').textContent='テーマを入力してください。';return}const base=presets[t]||generic(t,Number($('minutes').value)<=1?6:Number($('minutes').value)<=3?10:Number($('minutes').value)<=5?14:18);render(base);$('status').textContent=presets[t]?'試作構成を作成しました。各シーンはそのまま編集できます。':'編集用のシーン構成を作成しました。次段階でAIによる台本・画像生成を接続します。';$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>
