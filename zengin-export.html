<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>北九州銀行 総合振込ファイル</title><style>body{margin:0;background:#f3f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#20252b;color:#fff;padding:20px 18px}header h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:#d5d9df;font-size:13px}main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;color:#59616d;margin-bottom:4px}.field input,.field select{width:100%;box-sizing:border-box;border:1px solid #cfd5dc;border-radius:9px;padding:10px;font-size:15px;background:#fff}.wide{grid-column:1/-1}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#f5f7fa;border-radius:11px;text-align:center}.stat b{display:block;font-size:20px}.ok{border:2px solid #6fba82;background:#f4fbf6}.bad{border:2px solid #df8f8f;background:#fff7f7}.muted{font-size:13px;color:#68707b;line-height:1.6}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#20252b;color:#fff;font-size:16px;font-weight:800;margin-top:12px}.primary:disabled{opacity:.35}.note{padding:11px;border-radius:10px;background:#fff7df;font-size:13px;line-height:1.6}.status{margin-top:10px;font-weight:700}.link{color:#245d93;font-weight:700;text-decoration:none}@media(max-width:600px){.grid,.summary{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><h1>北九州銀行 総合振込ファイル</h1><p>確定済みの振込データから全銀協フォーマットを作成</p></header><main><section class="card" id="checkCard"><h2>振込データ確認</h2><div class="summary"><div class="stat"><b id="count">0</b><span class="muted">振込件数</span></div><div class="stat"><b id="total">0円</b><span class="muted">振込合計</span></div><div class="stat"><b id="ready">0</b><span class="muted">口座確定</span></div></div><div id="checkText" class="status"></div></section><section class="card"><h2>振込元情報</h2><p class="muted">ここだけ最初の1回入力してください。この端末に保存し、次回から自動表示します。銀行から案内された「振込依頼人コード」は推測せず、そのまま入力してください。</p><div class="grid"><div class="field"><label>振込指定日</label><input id="date" type="date"></div><div class="field"><label>振込依頼人コード（10桁）</label><input id="client" inputmode="numeric" maxlength="10"></div><div class="field wide"><label>振込依頼人名（半角カナ・英数字）</label><input id="clientName" placeholder="例：ｶ)ﾑﾗｶﾐ..." maxlength="40"></div><div class="field"><label>仕向銀行コード（4桁）</label><input id="bankCode" inputmode="numeric" maxlength="4"></div><div class="field"><label>仕向銀行名（半角カナ）</label><input id="bankName" value="ｷﾀｷﾕｳｼﾕｳ" maxlength="15"></div><div class="field"><label>仕向支店コード（3桁）</label><input id="branchCode" inputmode="numeric" maxlength="3"></div><div class="field"><label>仕向支店名（半角カナ）</label><input id="branchName" maxlength="15"></div><div class="field"><label>振込元口座種別</label><select id="type"><option value="1">普通</option><option value="2">当座</option><option value="9">その他</option></select></div><div class="field"><label>振込元口座番号（7桁以内）</label><input id="account" inputmode="numeric" maxlength="7"></div></div><button class="primary" id="saveSetup">振込元情報を保存</button><div id="setupStatus" class="muted"></div></section><section class="card"><h2>全銀ファイル作成</h2><div class="note">件数・総額・全振込先の口座がすべて確定した場合だけ作成できます。ファイルを作っても振込は実行されません。北九州銀行へ取り込んだ後、銀行画面で件数・総額・振込先を確認して承認してください。</div><button class="primary" id="download">北九州銀行用 全銀ファイルを作成</button><div id="status" class="status"></div><p class="muted"><a class="link" href="./payment-transfer.html?v=20260909-11">← 支払・振込準備へ戻る</a></p></section></main><script>
const RK='companyPaymentPrepV3',CK='companyPaymentControlV2',MK='bankTransferRecipientsV1',AK='bankTransferRecipientAliasesV1',SK='kitakyushuZenginSetupV1';const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('ja-JP')+'円';
function norm(s){return String(s||'').normalize('NFKC').toUpperCase().replace(/株式会社|有限会社|合同会社|合資会社|合名会社/g,'').replace(/\(株\)|\(有\)|㈱|㈲/g,'').replace(/[\s　・･.．,，、\-‐―ー_\/\\（）()]/g,'').trim()}
function fp(m){return [m.bank_code,m.branch_code,m.account_type_code,m.account_number,m.account_holder_kana].join('|')}
function get(){let rows=[],masters=[],aliases={},control=null;try{rows=JSON.parse(localStorage.getItem(RK)||'[]')}catch{}try{masters=JSON.parse(localStorage.getItem(MK)||'[]')}catch{}try{aliases=JSON.parse(localStorage.getItem(AK)||'{}')}catch{}try{control=JSON.parse(localStorage.getItem(CK)||'null')}catch{}return {rows,masters,aliases,control}}
function match(r,masters,aliases){const n=norm(r.supplier_name),a=aliases[n];if(a){const m=masters.find(x=>fp(x)===a);if(m)return m}const x=masters.filter(m=>norm(m.account_holder)===n);return x.length===1?x[0]:null}
function resolved(){const d=get();return {...d,pairs:d.rows.map(r=>({r,m:match(r,d.masters,d.aliases)}))}}
function render(){const d=resolved(),total=d.rows.reduce((s,r)=>s+(Number(r.amount)||0),0),ready=d.pairs.filter(x=>x.m).length,cc=d.control?.control_count,ct=d.control?.control_total,controlOk=cc!=null&&ct!=null&&Number(cc)===d.rows.length&&Number(ct)===total&&!d.control?.page_mismatch,all=controlOk&&ready===d.rows.length&&d.rows.length>0;$('count').textContent=d.rows.length;$('total').textContent=money(total);$('ready').textContent=ready;$('checkCard').className='card '+(all?'ok':'bad');$('checkText').textContent=all?'✅ 経理集計・AI抽出・振込先がすべて一致しています。':'⚠️ まだ全件確定していません。支払・振込準備へ戻って確認してください。';$('download').disabled=!all;return {d,total,all}}
function loadSetup(){let s={};try{s=JSON.parse(localStorage.getItem(SK)||'{}')}catch{}for(const k of ['client','clientName','bankCode','bankName','branchCode','branchName','type','account'])if(s[k]!=null)$(k).value=s[k];if(!$('date').value){const x=new Date();x.setDate(x.getDate()+1);$('date').value=x.toISOString().slice(0,10)}}
function setup(){return Object.fromEntries(['client','clientName','bankCode','bankName','branchCode','branchName','type','account'].map(k=>[k,$(k).value.trim()]))}
function validateSetup(s){if(!/^\d{10}$/.test(s.client))return '振込依頼人コードを10桁で入力してください。';if(!s.clientName)return '振込依頼人名を入力してください。';if(!/^\d{4}$/.test(s.bankCode))return '仕向銀行コードを4桁で入力してください。';if(!/^\d{3}$/.test(s.branchCode))return '仕向支店コードを3桁で入力してください。';if(!/^\d{1,7}$/.test(s.account))return '振込元口座番号を入力してください。';if(!/^[\x20-\x7E\uFF61-\uFF9F]+$/.test(s.clientName+s.bankName+s.branchName))return '依頼人名・銀行名・支店名は半角カナ・英数字で入力してください。';return ''}
$('saveSetup').onclick=()=>{const s=setup(),e=validateSetup(s);if(e){$('setupStatus').textContent=e;return}localStorage.setItem(SK,JSON.stringify(s));$('setupStatus').textContent='保存しました。次回から入力不要です。'};
const znum=(v,n)=>String(v??'').replace(/\D/g,'').padStart(n,'0').slice(-n),zchar=(v,n)=>(String(v??'').slice(0,n)+' '.repeat(n)).slice(0,n);
function bytesJis0201(text){const a=[];for(const ch of text){const c=ch.codePointAt(0);if(c>=0x20&&c<=0x7e)a.push(c);else if(c>=0xff61&&c<=0xff9f)a.push(0xa1+(c-0xff61));else throw new Error('全銀ファイルに使用できない全角文字があります: '+ch)}return a}
$('download').onclick=()=>{try{const {d,total,all}=render();if(!all)throw new Error('全件一致していないため作成できません。');const s=setup(),e=validateSetup(s);if(e)throw new Error(e);if(!$('date').value)throw new Error('振込指定日を入力してください。');localStorage.setItem(SK,JSON.stringify(s));const mmdd=$('date').value.slice(5,7)+$('date').value.slice(8,10);let rec=[];const header='1'+'21'+'0'+znum(s.client,10)+zchar(s.clientName,40)+mmdd+znum(s.bankCode,4)+zchar(s.bankName,15)+znum(s.branchCode,3)+zchar(s.branchName,15)+s.type+znum(s.account,7)+zchar('',17);if(header.length!==120)throw new Error('ヘッダー長エラー');rec.push(header);for(const {r,m} of d.pairs){const kana=String(m.account_holder_kana||'').trim();if(!kana)throw new Error(`${r.supplier_name} の口座名義カナがありません。`);const data='2'+znum(m.bank_code,4)+zchar(m.bank_name_kana||'',15)+znum(m.branch_code,3)+zchar(m.branch_name_kana||'',15)+zchar('',4)+(m.account_type_code||((m.account_type||'').includes('当座')?'2':'1'))+znum(m.account_number,7)+zchar(kana,30)+znum(r.amount,10)+'0'+znum(m.recipient_code1||'',10)+znum(m.recipient_code2||'',10)+'7'+zchar(m.identification==='Y'?'Y':'',1)+zchar('',7);if(data.length!==120)throw new Error(`${r.supplier_name} のデータ長エラー`);rec.push(data)}const trailer='8'+znum(d.rows.length,6)+znum(total,12)+zchar('',101),end='9'+zchar('',119);rec.push(trailer,end);const bytes=[];rec.forEach((x,i)=>{bytes.push(...bytesJis0201(x));if(i<rec.length-1)bytes.push(13,10)});const blob=new Blob([new Uint8Array(bytes)],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kitakyushu_sougo_${$('date').value.replaceAll('-','')}_${d.rows.length}ken.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent=`作成しました：${d.rows.length}件・${money(total)}。銀行取込後も必ず同じ件数・総額か確認してください。`;}catch(e){$('status').textContent='作成できませんでした：'+(e.message||e)}};
loadSetup();render();</script></body></html>
