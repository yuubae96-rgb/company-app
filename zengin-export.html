<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北九州銀行 総合振込ファイル</title><style>body{margin:0;background:#f3f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;color:#59616d;margin-bottom:4px}.field input,.field select{width:100%;box-sizing:border-box;border:1px solid #cfd5dc;border-radius:9px;padding:10px;font-size:15px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#f5f7fa;border-radius:11px;text-align:center}.stat b{display:block;font-size:20px}.ok{border:2px solid #6fba82;background:#f4fbf6}.warn{border:2px solid #dfb76e;background:#fffaf0}.muted{font-size:13px;color:#68707b;line-height:1.6}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#176b31;color:#fff;font-size:17px;font-weight:800;margin-top:12px}.primary:disabled{opacity:.35}.note{padding:11px;border-radius:10px;background:#fff7df;font-size:13px;line-height:1.6}.status{margin-top:10px;font-weight:700}@media(max-width:600px){.grid,.summary{grid-template-columns:1fr}}</style></head><body><main><section class="card" id="checkCard"><h2>全銀ファイルに入る内容</h2><div class="summary"><div class="stat"><b id="count">0</b>今回の振込</div><div class="stat"><b id="ready">0</b>ファイル出力</div><div class="stat"><b id="skip">0</b>要確認・除外</div></div><div id="checkText" class="status"></div></section><section class="card"><h2>振込元情報</h2><div class="grid"><div class="field"><label>振込指定日</label><input id="date" type="date"></div><div class="field"><label>振込依頼人コード（10桁）</label><input id="client" maxlength="10"></div><div class="field"><label>振込依頼人名（カナ）</label><input id="clientName"></div><div class="field"><label>仕向銀行コード</label><input id="bankCode" maxlength="4"></div><div class="field"><label>仕向銀行名（カナ）</label><input id="bankName" value="ｷﾀｷﾕｳｼﾕｳ"></div><div class="field"><label>仕向支店コード</label><input id="branchCode" maxlength="3"></div><div class="field"><label>仕向支店名（カナ）</label><input id="branchName"></div><div class="field"><label>振込元口座種別</label><select id="type"><option value="1">普通</option><option value="2">当座</option><option value="9">その他</option></select></div><div class="field"><label>振込元口座番号</label><input id="account" maxlength="7"></div></div><button class="primary" id="saveSetup">振込元情報を保存</button><div id="setupStatus" class="muted"></div></section><section class="card"><h2>全銀ファイル作成</h2><div class="note" id="note">経理の件数・総額が一致していれば、要確認の振込先が残っていても、口座確定済み分だけで全銀ファイルを作成できます。要確認分はファイルに含めません。</div><button class="primary" id="download">北九州銀行用 全銀ファイルを作成</button><div id="status" class="status"></div></section></main><script>
const RK='companyPaymentPrepV3',CK='companyPaymentControlV2',MK='bankTransferRecipientsV1',AK='bankTransferRecipientAliasesV1',NK='bankTransferSupplierNameCorrectionsV1',SK='kitakyushuZenginSetupV1';const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ja-JP')+'円';function norm(s){return String(s||'').normalize('NFKC').toUpperCase().replace(/株式会社|有限会社|合同会社/g,'').replace(/\(株\)|\(有\)|㈱|㈲/g,'').replace(/[\s　・･.．,，、\-‐―ー_\/\\（）()]/g,'').trim()}function fp(m){return [m.bank_code,m.branch_code,m.account_type_code,m.account_number,m.account_holder_kana].join('|')}function get(){let rows=[],masters=[],aliases={},control=null,corr={};try{rows=JSON.parse(localStorage.getItem(RK)||'[]')}catch{}try{masters=JSON.parse(localStorage.getItem(MK)||'[]')}catch{}try{aliases=JSON.parse(localStorage.getItem(AK)||'{}')}catch{}try{control=JSON.parse(localStorage.getItem(CK)||'null')}catch{}try{corr=JSON.parse(localStorage.getItem(NK)||'{}')}catch{}return{rows,masters,aliases,control,corr}}function match(r,d){const name=d.corr[norm(r.supplier_name)]||r.supplier_name,n=norm(name),a=d.aliases[n];if(a){const m=d.masters.find(x=>fp(x)===a);if(m)return m}const x=d.masters.filter(m=>norm(m.account_holder)===n);return x.length===1?x[0]:null}function resolved(){const d=get();d.pairs=d.rows.map(r=>({r,m:match(r,d)}));return d}function render(){const d=resolved(),grand=d.rows.reduce((s,r)=>s+(Number(r.amount)||0),0),confirmed=d.pairs.filter(x=>x.m),ready=confirmed.length,skip=d.rows.length-ready,outTotal=confirmed.reduce((s,x)=>s+(Number(x.r.amount)||0),0),controlOk=!!d.control&&Number(d.control.control_count)===d.rows.length&&Number(d.control.control_total)===grand&&!d.control.page_mismatch,can=controlOk&&ready>0;$('count').textContent=d.rows.length;$('ready').textContent=ready;$('skip').textContent=skip;$('checkCard').className='card '+(skip?'warn':'ok');$('checkText').textContent=!controlOk?'⚠️ 経理集計とAI抽出が一致していないため出力できません。':skip?`⚠️ ${skip}件は要確認のため除外。${ready}件・${money(outTotal)}を出力します。`:`✅ ${ready}件・${money(outTotal)}を出力できます。`;$('download').disabled=!can;return{d,confirmed,outTotal,skip,can}}
const kanaMap={"ガ":"ｶﾞ","ギ":"ｷﾞ","グ":"ｸﾞ","ゲ":"ｹﾞ","ゴ":"ｺﾞ","ザ":"ｻﾞ","ジ":"ｼﾞ","ズ":"ｽﾞ","ゼ":"ｾﾞ","ゾ":"ｿﾞ","ダ":"ﾀﾞ","ヂ":"ﾁﾞ","ヅ":"ﾂﾞ","デ":"ﾃﾞ","ド":"ﾄﾞ","バ":"ﾊﾞ","ビ":"ﾋﾞ","ブ":"ﾌﾞ","ベ":"ﾍﾞ","ボ":"ﾎﾞ","パ":"ﾊﾟ","ピ":"ﾋﾟ","プ":"ﾌﾟ","ペ":"ﾍﾟ","ポ":"ﾎﾟ","ヴ":"ｳﾞ","ア":"ｱ","イ":"ｲ","ウ":"ｳ","エ":"ｴ","オ":"ｵ","カ":"ｶ","キ":"ｷ","ク":"ｸ","ケ":"ｹ","コ":"ｺ","サ":"ｻ","シ":"ｼ","ス":"ｽ","セ":"ｾ","ソ":"ｿ","タ":"ﾀ","チ":"ﾁ","ツ":"ﾂ","テ":"ﾃ","ト":"ﾄ","ナ":"ﾅ","ニ":"ﾆ","ヌ":"ﾇ","ネ":"ﾈ","ノ":"ﾉ","ハ":"ﾊ","ヒ":"ﾋ","フ":"ﾌ","ヘ":"ﾍ","ホ":"ﾎﾞ","マ":"ﾏ","ミ":"ﾐ","ム":"ﾑ","メ":"ﾒ","モ":"ﾓ","ヤ":"ﾔ","ユ":"ﾕ","ヨ":"ﾖ","ラ":"ﾗ","リ":"ﾘ","ル":"ﾙ","レ":"ﾚ","ロ":"ﾛ","ワ":"ﾜ","ヲ":"ｦ","ン":"ﾝ","ァ":"ｧ","ィ":"ｨ","ゥ":"ｩ","ェ":"ｪ","ォ":"ｫ","ッ":"ｯ","ャ":"ｬ","ュ":"ｭ","ョ":"ｮ","ー":"ｰ"};function toH(s){return String(s??'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').replace(/[ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィゥェォッャュョー]/g,ch=>kanaMap[ch]||ch)}function loadSetup(){let s={};try{s=JSON.parse(localStorage.getItem(SK)||'{}')}catch{}for(const k of ['client','clientName','bankCode','bankName','branchCode','branchName','type','account'])if(s[k]!=null)$(k).value=s[k];if(!$('date').value){const x=new Date();x.setDate(x.getDate()+1);$('date').value=x.toISOString().slice(0,10)}}function setup(){const s={client:$('client').value.trim(),clientName:toH($('clientName').value.trim()),bankCode:$('bankCode').value.trim(),bankName:toH($('bankName').value.trim()),branchCode:$('branchCode').value.trim(),branchName:toH($('branchName').value.trim()),type:$('type').value,account:$('account').value.trim()};return s}function validate(s){if(!/^\d{10}$/.test(s.client))return'振込依頼人コードを10桁で入力してください。';if(!s.clientName)return'振込依頼人名を入力してください。';if(!/^\d{4}$/.test(s.bankCode))return'仕向銀行コードを4桁で入力してください。';if(!/^\d{3}$/.test(s.branchCode))return'仕向支店コードを3桁で入力してください。';if(!/^\d{1,7}$/.test(s.account))return'振込元口座番号を入力してください。';return''}$('saveSetup').onclick=()=>{const s=setup(),e=validate(s);if(e)return $('setupStatus').textContent=e;localStorage.setItem(SK,JSON.stringify(s));$('setupStatus').textContent='保存しました。次回から入力不要です。'};const znum=(v,n)=>String(v??'').replace(/\D/g,'').padStart(n,'0').slice(-n),zchar=(v,n)=>(toH(String(v??'')).slice(0,n)+' '.repeat(n)).slice(0,n);function bytes(text){const a=[];for(const ch of text){const c=ch.codePointAt(0);if(c>=0x20&&c<=0x7e)a.push(c);else if(c>=0xff61&&c<=0xff9f)a.push(0xa1+(c-0xff61));else throw Error('全銀ファイルに使用できない文字があります: '+ch)}return a}$('download').onclick=()=>{try{const {d,confirmed,outTotal,skip,can}=render();if(!can)throw Error('経理集計の確認が完了していません。');if(skip&&!confirm(`要確認 ${skip}件は全銀ファイルに含めません。\n口座確定済み ${confirmed.length}件・${money(outTotal)}だけ出力します。\n続けますか？`))return;const s=setup(),e=validate(s);if(e)throw Error(e);localStorage.setItem(SK,JSON.stringify(s));if(!$('date').value)throw Error('振込指定日を入力してください。');const mmdd=$('date').value.slice(5,7)+$('date').value.slice(8,10),rec=[];rec.push('1'+'21'+'0'+znum(s.client,10)+zchar(s.clientName,40)+mmdd+znum(s.bankCode,4)+zchar(s.bankName,15)+znum(s.branchCode,3)+zchar(s.branchName,15)+s.type+znum(s.account,7)+zchar('',17));for(const {r,m} of confirmed){const bankDonor=d.masters.find(x=>String(x.bank_code)===String(m.bank_code)&&x.bank_name_kana),branchDonor=d.masters.find(x=>String(x.bank_code)===String(m.bank_code)&&String(x.branch_code)===String(m.branch_code)&&x.branch_name_kana),bankKana=toH(m.bank_name_kana||bankDonor?.bank_name_kana||''),branchKana=toH(m.branch_name_kana||branchDonor?.branch_name_kana||''),holder=toH(m.account_holder_kana||'');if(!bankKana||!branchKana||!holder)throw Error(`${r.supplier_name} の銀行・支店・口座名義カナを確認してください。`);const data='2'+znum(m.bank_code,4)+zchar(bankKana,15)+znum(m.branch_code,3)+zchar(branchKana,15)+zchar('',4)+(m.account_type_code||((m.account_type||'').includes('当座')?'2':'1'))+znum(m.account_number,7)+zchar(holder,30)+znum(r.amount,10)+'0'+znum(m.recipient_code1||'',10)+znum(m.recipient_code2||'',10)+'7'+zchar(m.identification==='Y'?'Y':'',1)+zchar('',7);if(data.length!==120)throw Error(`${r.supplier_name} のデータ長エラー`);rec.push(data)}rec.push('8'+znum(confirmed.length,6)+znum(outTotal,12)+zchar('',101),'9'+zchar('',119));const out=[];rec.forEach((x,i)=>{out.push(...bytes(x));if(i<rec.length-1)out.push(13,10)});const blob=new Blob([new Uint8Array(out)],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kitakyushu_sougo_${$('date').value.replaceAll('-','')}_${confirmed.length}ken.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent=`作成しました：${confirmed.length}件・${money(outTotal)}${skip?`（要確認 ${skip}件は除外）`:''}`;}catch(e){$('status').textContent='作成できませんでした：'+(e.message||e)}};loadSetup();render();</script></body></html>
