<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>銀行振込</title><style>body{margin:0;background:#f3f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#20252b;color:#fff;padding:22px 18px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#d5d9df;font-size:13px}main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #0000000a}.step{font-size:12px;font-weight:800;color:#8a6429;margin-bottom:5px}.title{font-size:20px;font-weight:800;margin-bottom:6px}.muted{font-size:13px;color:#68707b;line-height:1.6}.btn{display:block;text-decoration:none;text-align:center;border-radius:12px;padding:14px;font-size:16px;font-weight:800;margin-top:12px;background:#20252b;color:#fff}.subbtn{background:#e9edf2;color:#20242a}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f5f7fa;border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.ok{border:2px solid #6fba82;background:#f4fbf6}.warn{border:2px solid #dfb76e;background:#fffaf0}@media(max-width:600px){.summary{grid-template-columns:1fr}}</style></head><body><header><h1>銀行振込</h1><p>振込先マスター → 支払一覧AI読取 → 銀行取込ファイル作成</p></header><main><section class="card" id="statusCard"><div class="title">現在の準備状況</div><div class="summary"><div class="stat"><b id="master">0</b><span class="muted">振込先マスター</span></div><div class="stat"><b id="pay">0</b><span class="muted">今回の振込</span></div><div class="stat"><b id="ready">0</b><span class="muted">口座確定</span></div></div><p id="status" class="muted"></p></section><section class="card"><div class="step">STEP 1</div><div class="title">振込先マスター</div><div class="muted">北九州銀行の登録振込先を管理します。最初はCSV一括登録、新規取引先だけ1件ずつ追加できます。</div><a class="btn subbtn" href="bank-master.html?v=20260909-3">振込先マスターを開く</a></section><section class="card"><div class="step">STEP 2</div><div class="title">支払・振込準備</div><div class="muted">経理の支払一覧をAIで読み、振込対象・金額・振込先マスターを照合します。</div><a class="btn" href="payment-transfer.html?v=20260909-11">支払一覧を読み取る</a></section><section class="card"><div class="step">STEP 3</div><div class="title">北九州銀行へ一括取込</div><div class="muted">全件が「振込準備OK」になったら、北九州銀行の総合振込へ取り込む全銀ファイルを作成します。振込実行・承認は銀行画面で行います。</div><a class="btn" href="zengin-export.html?v=20260909-2">全銀ファイルを作成する</a></section></main><script>const MK='bankTransferRecipientsV1',RK='companyPaymentPrepV3',AK='bankTransferRecipientAliasesV1';function norm(s){return String(s||'').normalize('NFKC').toUpperCase().replace(/株式会社|有限会社|合同会社|合資会社|合名会社/g,'').replace(/\(株\)|\(有\)|㈱|㈲/g,'').replace(/[\s　・･.．,，、\-‐―ー_\/\\（）()]/g,'').trim()}function fp(m){return [m.bank_code,m.branch_code,m.account_type_code,m.account_number,m.account_holder_kana].join('|')}let m=[],r=[],a={};try{m=JSON.parse(localStorage.getItem(MK)||'[]')}catch{}try{r=JSON.parse(localStorage.getItem(RK)||'[]')}catch{}try{a=JSON.parse(localStorage.getItem(AK)||'{}')}catch{}function match(x){const n=norm(x.supplier_name),f=a[n];if(f){const z=m.find(y=>fp(y)===f);if(z)return z}const z=m.filter(y=>norm(y.account_holder)===n);return z.length===1?z[0]:null}const ready=r.filter(match).length;document.getElementById('master').textContent=m.length;document.getElementById('pay').textContent=r.length;document.getElementById('ready').textContent=ready;const all=r.length>0&&ready===r.length;document.getElementById('statusCard').classList.add(all?'ok':'warn');document.getElementById('status').textContent=all?'✅ 今回の振込先はすべて確定しています。STEP 3へ進めます。':r.length?'未確定の振込先があります。STEP 2で確認してください。':'STEP 1でマスターを準備し、STEP 2で支払一覧を読み取ってください。';</script></body></html>
