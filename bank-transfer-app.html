<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>銀行振込</title><style>body{margin:0;background:#f3f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#20252b;color:#fff;padding:22px 18px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#d5d9df;font-size:13px}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #0000000a}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flow div{background:#f5f7fa;border-radius:11px;padding:12px;text-align:center;font-size:13px;font-weight:800}.flow b{display:block;font-size:18px;margin-bottom:3px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f5f7fa;border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.muted{font-size:13px;color:#68707b;line-height:1.6}.section-title{font-size:21px;font-weight:800;margin:0 0 8px}.frame{width:100%;border:0;border-radius:12px;background:#fff;display:block}.payframe{height:2100px}.exportframe{width:100%;height:760px;border:0;border-radius:12px;background:#fff;margin-top:12px}.offscreen{position:absolute;left:-99999px;width:1px;height:1px;border:0}.settings summary{cursor:pointer;font-weight:800}.settings a{display:block;margin-top:12px;padding:12px;text-align:center;border-radius:10px;background:#e9edf2;color:#20242a;text-decoration:none;font-weight:800}@media(max-width:650px){.flow,.summary{grid-template-columns:1fr}.payframe{height:2500px}}</style></head><body><header><h1>銀行振込</h1><p>経理PDFを入れる → 要確認だけ見る → 全銀ファイルを出力</p></header><main><section class="card"><div class="flow"><div><b>1</b>経理PDFを入れる</div><div><b>2</b>黄色だけ確認</div><div><b>3</b>全銀ファイルを出力</div></div><div class="summary"><div class="stat"><b id="master">0</b><span class="muted">振込先マスター</span></div><div class="stat"><b id="pay">0</b><span class="muted">今回の振込</span></div><div class="stat"><b id="ready">0</b><span class="muted">口座確定</span></div></div><p id="status" class="muted"></p></section><section class="card"><div class="section-title">経理の支払一覧を読み込む</div><p class="muted">要確認があれば上の方にまとめて表示します。全部一致していなくても、口座確定済み分は全銀ファイルに出せます。</p><iframe id="payFrame" class="frame payframe" src="payment-transfer.html?v=20260909-80" title="支払・振込準備"></iframe></section><section class="card settings"><details><summary>設定・振込先マスター（普段は触らなくてOK）</summary><a href="bank-master.html?v=20260909-5">振込先マスターを開く</a><a href="zengin-export.html?v=20260909-8">振込元情報・全銀設定を確認する</a></details></section><iframe id="exportFrame" class="offscreen" src="zengin-export.html?v=20260909-8" title="全銀ファイル作成"></iframe></main><script>
const MK='bankTransferRecipientsV1',RK='companyPaymentPrepV3',CK='companyPaymentControlV2',AK='bankTransferRecipientAliasesV1',NK='bankTransferSupplierNameCorrectionsV1';
function norm(s){return String(s||'').normalize('NFKC').toUpperCase().replace(/株式会社|有限会社|合同会社/g,'').replace(/\(株\)|\(有\)|㈱|㈲/g,'').replace(/[\s　・･.．,，、\-‐―ー_\/\\（）()]/g,'').trim()}
function fp(m){return [m.bank_code,m.branch_code,m.account_type_code,m.account_number,m.account_holder_kana].join('|')}
function state(){let m=[],r=[],a={},c=null,nc={};try{m=JSON.parse(localStorage.getItem(MK)||'[]')}catch{}try{r=JSON.parse(localStorage.getItem(RK)||'[]')}catch{}try{a=JSON.parse(localStorage.getItem(AK)||'{}')}catch{}try{c=JSON.parse(localStorage.getItem(CK)||'null')}catch{}try{nc=JSON.parse(localStorage.getItem(NK)||'{}')}catch{}function corrected(x){return nc[norm(x)]||x}function match(x){const n=norm(corrected(x.supplier_name)),f=a[n];if(f){const z=m.find(y=>fp(y)===f);if(z)return z}const z=m.filter(y=>norm(y.account_holder)===n);return z.length===1?z[0]:null}const readyCount=r.filter(match).length,total=r.reduce((s,x)=>s+(Number(x.amount)||0),0),controlOk=!!c&&Number(c.control_count)===r.length&&Number(c.control_total)===total&&!c.page_mismatch;return {m,r,ready:readyCount,total,controlOk,unresolved:r.length-readyCount}}
function injectQuickButton(s){const f=document.getElementById('payFrame');let d;try{d=f.contentDocument}catch{return}if(!d)return;let box=d.getElementById('oneClickZengin');if(!box){box=d.createElement('section');box.id='oneClickZengin';box.className='card';const anchor=d.getElementById('reviewCard')||d.getElementById('controlCard');if(anchor)anchor.insertAdjacentElement('afterend',box);else return}const can=s.controlOk&&s.ready>0;box.style.display=can?'block':'none';if(can){box.style.border='3px solid #3f9b57';box.style.background='#f1fbf3';box.innerHTML=`<h2 style="margin:0 0 8px">全銀ファイル出力</h2><p style="margin:0 0 12px;font-weight:700">${s.unresolved?`要確認 ${s.unresolved}件は除外し、口座確定済み ${s.ready}件を出力します。`:`${s.ready}件すべて口座確定済みです。`}</p><button id="oneClickZenginBtn" style="width:100%;border:0;border-radius:12px;padding:17px;background:#176b31;color:white;font-size:19px;font-weight:800;cursor:pointer">北九州銀行用 全銀ファイルを出力（${s.ready}件）</button><div id="oneClickZenginStatus" style="font-size:13px;color:#68707b;margin-top:8px">未確認の振込先はファイルに含めません。</div>`;d.getElementById('oneClickZenginBtn').onclick=downloadZengin}}
function downloadZengin(){const pf=document.getElementById('payFrame'),ef=document.getElementById('exportFrame');let pd;try{pd=pf.contentDocument}catch{}const msg=t=>{try{const el=pd&&pd.getElementById('oneClickZenginStatus');if(el)el.textContent=t}catch{}};try{const ed=ef.contentDocument;if(!ed){msg('全銀作成機能を読み込み中です。数秒後にもう一度押してください。');return}const b=ed.getElementById('download');if(!b){msg('全銀作成ボタンを読み込めませんでした。ページを更新してください。');return}if(b.disabled){msg('全銀作成側で確認待ちです。振込元情報が保存済みか確認してください。');return}msg('全銀ファイルを作成しています…');b.click();setTimeout(()=>{const st=ed.getElementById('status')?.textContent||'';if(st){msg(st)}else{msg('反応がない場合は、下に全銀作成画面を表示します。');ef.className='exportframe';ef.scrollIntoView({behavior:'smooth',block:'center'})}},700)}catch(e){msg('全銀ファイルを作成できませんでした。下に設定画面を表示します。');ef.className='exportframe';ef.scrollIntoView({behavior:'smooth',block:'center'})}}
function refresh(){const s=state();document.getElementById('master').textContent=s.m.length;document.getElementById('pay').textContent=s.r.length;document.getElementById('ready').textContent=s.ready;document.getElementById('status').textContent=!s.r.length?'まず経理のPDFを入れてください。':s.controlOk?(s.unresolved?`⚠️ 要確認 ${s.unresolved}件。確定済み ${s.ready}件はそのまま出力できます。`:'✅ 全件口座確定。全銀ファイルを出力できます。'):'⚠️ 経理集計とAI抽出が一致していません。';injectQuickButton(s)}
document.getElementById('payFrame').addEventListener('load',refresh);document.getElementById('exportFrame').addEventListener('load',refresh);setInterval(refresh,1200);refresh();
</script></body></html>
