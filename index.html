<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="社内アプリ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>社内アプリ</title>
<style>
:root{--bg:#eef0f2;--ink:#1f2328;--muted:#6b7280;--card:#fff;--line:#d9dde2;--brass:#b27a2c;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
header{padding:calc(22px + var(--safe-top)) 20px 24px;background:linear-gradient(180deg,#31363d,#1d2126);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.wrap{max-width:720px;margin:0 auto} .eyebrow{font-size:12px;letter-spacing:.14em;color:#dbc18f;font-weight:700;margin-bottom:8px}
h1{font-size:26px;margin:0 0 6px} .sub{font-size:13px;color:#c7cbd1}
main{padding:20px 16px calc(28px + var(--safe-bottom))} .grid{display:grid;grid-template-columns:1fr;gap:14px}
.app-card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.05);-webkit-tap-highlight-color:transparent}
.row{display:flex;align-items:center;gap:14px} .icon{width:56px;height:56px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:#33250f;background:linear-gradient(145deg,#e1c48b,#9f6a27);border:1px solid rgba(0,0,0,.18)}
.title{font-size:19px;font-weight:800;margin-bottom:4px} .desc{font-size:13px;color:var(--muted);line-height:1.55} .arrow{margin-left:auto;font-size:26px;color:#a0a6ad}
.note{margin-top:18px;padding:14px 15px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:12.5px;line-height:1.65;color:var(--muted)} .note b{color:var(--ink)}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">COMPANY TOOLS</div><h1>社内アプリ</h1><div class="sub">使いたいアプリを選んでください</div></div></header>
<main class="wrap">
<div class="grid">
<a class="app-card" href="https://yuubae96-rgb.github.io/order-search-app/">
<div class="row"><div class="icon">見</div><div><div class="title">見積管理</div><div class="desc">見積登録・検索・分析<br>回答待ち／受注／失注を管理</div></div><div class="arrow">›</div></div>
</a>
<a class="app-card" href="https://yuubae96-rgb.github.io/nameplate-app/index.html">
<div class="row"><div class="icon">銘</div><div><div class="title">銘板見積</div><div class="desc">材質・板厚・サイズなどから<br>銘板の見積もりを計算</div></div><div class="arrow">›</div></div>
</a>
</div>
<div class="note"><b>この入口はあとから増やせます。</b><br>在庫管理、不良記録、工程進捗、営業管理などを作ったら、ここにボタンを追加できます。</div>
</main>
</body>
</html>
