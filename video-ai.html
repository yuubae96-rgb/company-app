<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16233f"><meta name="apple-mobile-web-app-capable" content="yes"><title>動画AI解析</title><style>:root{--bg:#f3f5f7;--card:#fff;--ink:#16233f;--muted:#68758c;--line:#dce2e8;--accent:#0f6e5f;--danger:#b83a32}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:760px;margin:auto}.head{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;background:linear-gradient(180deg,#253756,#16233f);color:#fff}.head h1{font-size:23px;margin:0}.head p{font-size:12px;line-height:1.6;margin:6px 0 0;color:#cbd4df}main{padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 13px}.field{margin-bottom:13px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px;padding:11px;min-height:46px}textarea{min-height:160px;resize:vertical;line-height:1.6}.drop{border:2px dashed #b7c0cc;border-radius:14px;padding:18px;text-align:center;background:#fafbfc}.drop input{border:0;padding:8px 0;min-height:auto}.meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}video{display:none;width:100%;margin-top:12px;border-radius:12px;background:#000;max-height:330px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preset{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:46px;padding:7px 4px;font-weight:800;color:var(--ink);font-size:14px}.preset.active{background:var(--ink);color:#fff;border-color:var(--ink)}.run{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:900;min-height:54px}.run:disabled{opacity:.45}.status{font-size:13px;color:var(--muted);line-height:1.6;margin-top:10px}.progress{height:8px;background:#e8ecef;border-radius:999px;overflow:hidden;margin-top:8px;display:none}.bar{height:100%;width:0;background:var(--accent);transition:width .3s}.result{white-space:pre-wrap;line-height:1.75;font-size:15px}.result.empty{color:var(--muted)}.warn{font-size:12px;line-height:1.65;background:#fff8e7;border:1px solid #ead9aa;border-radius:10px;padding:10px;color:#655224}.ok{color:var(--accent);font-weight:800}.error{color:var(--danger)}.foot{font-size:11px;color:var(--muted);line-height:1.65}</style></head><body><div class="app"><div class="head"><h1>動画AI解析</h1><p>APIキー入力不要。動画をGeminiへ送り、目的別にAI分析します。</p></div><main><div class="card"><h2>1. 動画を選択</h2><div class="drop"><input id="videoFile" type="file" accept="video/*"><div class="meta" id="fileInfo">iPhoneの通常動画も選べます。</div></div><video id="preview" controls playsinline></video><div class="meta">動画はSupabase経由でGemini Files APIへ安全に送信して解析します。</div></div><div class="card"><h2>2. 何を見てもらう？</h2><div class="actions"><button class="preset active" data-preset="general">普通に解説</button><button class="preset" data-preset="golf">ゴルフ分析</button><button class="preset" data-preset="improve">作業改善</button><button class="preset" data-preset="safety">危険動作</button><button class="preset" data-preset="inspect">検品</button><button class="preset" data-preset="manual">手順書作成</button></div><div class="field" style="margin-top:12px"><label>AIへの指示（自由に書き換えできます）</label><textarea id="prompt"></textarea></div><div class="field"><label>モデル</label><select id="model"><option value="gemini-3.5-flash">Gemini 3.5 Flash</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option></select></div></div><div class="card"><button class="run" id="run">動画をAI解析する</button><div class="progress" id="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">動画を選んだら解析できます。APIキー入力は不要です。</div></div><div class="card"><h2>AIの回答</h2><div class="result empty" id="result">まだ解析していません。</div></div><div class="warn">AIの指摘は補助情報です。安全・品質・合否の最終判断は人が確認してください。</div><p class="foot">Gemini APIキーはSupabase側のSecretに保存され、ブラウザやGitHubには表示しません。</p></main></div><script>
const $=id=>document.getElementById(id),TWO_GB=2*1024*1024*1024,sleep=ms=>new Promise(r=>setTimeout(r,ms));const FN='https://vnnvuxccazkdzwqjmntz.supabase.co/functions/v1/video-ai-gemini';const prompts={general:'この動画をよく観察して、何が起きているか日本語で詳しく説明してください。重要な動作があれば、時系列に沿って説明してください。映像だけでは断定できないことは断定せず、その旨も書いてください。',golf:'このゴルフスイング動画をコーチの視点で分析してください。アドレス、テークバック、トップ、ダウンスイング、インパクト付近、フォローの順に観察し、腰・肩・腕・手首・頭の動きを見てください。手打ち傾向があるかも、映像から確認できる根拠とともに評価してください。最後に良い点・改善点・練習で意識することをまとめてください。',improve:'この動画を製造現場の改善担当者として分析してください。作業を工程順・時系列で説明し、無駄な動作や移動、待ち時間、持ち替え・探す・取りに行く動作、姿勢や配置、時間短縮できそうな点を指摘してください。可能なら該当時刻も示し、最後にすぐできる改善を優先順位順に3つ提案してください。',safety:'この動画を製造現場の安全担当者として観察してください。作業内容を時系列で説明し、手や指が危険箇所に近づく動作、挟まれ・巻き込まれ・切創・転倒につながりそうな動作、無理な姿勢、保護具や安全確認で気になる点を見える範囲で指摘してください。可能なら該当時刻と危険度も示してください。',inspect:'この動画を製造品の検品補助として観察してください。傷・汚れ・欠け、印刷のかすれ・文字抜け・にじみ、位置ずれや向き、数量や部品の入れ忘れ、その他気になる箇所を探してください。確認できない項目は確認不能とし、合否を断定せず人が再確認すべき箇所を示してください。',manual:'この動画から新人教育用の作業マニュアルを作ってください。作業を工程に分け、各工程について「何をする」「どこを見る」「注意点」を整理してください。映像だけで分からない設定値や社内ルールは要確認としてください。'};$('prompt').value=prompts.general;let objectUrl='';document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('prompt').value=prompts[b.dataset.preset]});$('videoFile').onchange=()=>{const f=$('videoFile').files[0];if(!f)return;const mb=(f.size/1024/1024).toFixed(1);$('fileInfo').innerHTML=`${f.name} / ${mb}MB / ${f.type||'video'}${f.size>TWO_GB?'<br><span class="error">2GBを超えています。</span>':'<br><span class="ok">解析可能サイズです。</span>'}`;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);$('preview').src=objectUrl;$('preview').style.display='block'};function prog(p,m){$('progress').style.display='block';$('bar').style.width=p+'%';$('status').textContent=m}async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}async function upload(url,file){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-video-upload-url':url},body:file});let d;try{d=await r.json()}catch{throw new Error(`アップロード失敗 HTTP ${r.status}`)}if(!r.ok)throw new Error(d?.error||`アップロード失敗 HTTP ${r.status}`);return d.file||d}$('run').onclick=async()=>{const file=$('videoFile').files[0],prompt=$('prompt').value.trim(),model=$('model').value;if(!file){$('status').innerHTML='<span class="error">動画を選択してください。</span>';return}if(file.size>TWO_GB){$('status').innerHTML='<span class="error">2GB以下の動画を選択してください。</span>';return}if(!prompt)return;$('run').disabled=true;$('result').textContent='';try{prog(5,'アップロードを準備しています…');const s=await call({action:'startUpload',size:file.size,mime:file.type||'video/mp4',name:file.name});prog(20,'動画をGeminiへアップロードしています…');let info=await upload(s.uploadUrl,file);prog(55,'Geminiが動画を処理しています…');for(let i=0;i<120;i++){if(String(info.state||'').toUpperCase()==='ACTIVE')break;if(String(info.state||'').toUpperCase()==='FAILED')throw new Error('動画処理に失敗しました。');await sleep(3000);info=await call({action:'fileStatus',fileName:info.name});if(i%4===0)prog(Math.min(75,55+i/4),'Geminiが動画を処理しています…')}if(String(info.state||'').toUpperCase()!=='ACTIVE')throw new Error('動画処理が時間内に完了しませんでした。');prog(80,'AIが動画を解析しています…');const data=await call({action:'analyze',model,fileUri:info.uri,mime:info.mimeType||file.type||'video/mp4',prompt});const text=(data.candidates||[]).flatMap(c=>c.content?.parts||[]).map(p=>p.text||'').filter(Boolean).join('\n\n');if(!text)throw new Error('AIから回答を取得できませんでした。');prog(100,'解析完了');$('result').classList.remove('empty');$('result').textContent=text}catch(e){$('status').innerHTML='<span class="error">エラーが発生しました。</span>';$('result').classList.remove('empty');$('result').textContent=String(e.message||e)}finally{$('run').disabled=false}};</script></body></html>
