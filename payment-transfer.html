<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支払・振込準備</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f3f5f7;color:#20242a;margin:0}header{background:#20252b;color:#fff;padding:20px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:18px;margin-bottom:15px}.drop{padding:22px;border:2px dashed #bbb;border-radius:12px;text-align:center}.primary,button{border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:10px;background:#20252b;color:#fff}.summary,.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fields{grid-template-columns:1fr 1fr}.stat{background:#f5f7fa;padding:12px;text-align:center;border-radius:10px}.stat b{display:block;font-size:20px}.item{padding:15px 0;border-bottom:1px solid #ddd}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#fff1cf}.ok{background:#e8f7ec}.masterline{margin-top:8px;padding:10px;border-radius:10px;background:#fff7df}.good{background:#eff9f2}.candidate-row{padding:9px 0;border-top:1px solid #eadfb7}.candidate-row button{background:#20252b;color:#fff}.field input{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px}.muted{font-size:13px;color:#68707b}.progressbox{display:none;background:#eef5ff;padding:14px;border-radius:12px;margin-top:10px}.progressbar{height:9px;background:#dce5ef;border-radius:9px;overflow:hidden}.progressbar span{display:block;height:100%;background:#4d719c;width:8%}.review{display:none;border:3px solid #dfb76e;background:#fffaf0}.review h2{margin-top:0}.review-item{padding:12px 0;border-top:1px solid #eadfb7}.review-item:first-child{border-top:0}.review-item button{background:#20252b;color:#fff;margin-top:7px}.review-name{font-size:17px;font-weight:800}@media(max-width:600px){.summary,.fields{grid-template-columns:1fr}}</style></head><body><header><h1>支払・振込準備</h1></header><main><section class="card"><div class="drop"><strong>PDF / 画像を選択</strong><br><input id="files" type="file" multiple accept="application/pdf,image/*"></div><button class="primary" id="register">AIで振込対象を読み取る</button><div id="progress" class="progressbox"><b id="progressText">AI読取を開始しています…</b><div class="progressbar"><span id="progressBar"></span></div><div id="progressTime" class="muted"></div></div><div id="readStatus" class="muted"></div></section><section class="card review" id="reviewCard"><h2>⚠️ ここだけ確認してください</h2><div id="reviewBody"></div></section><section class="card" id="controlCard"><h2>経理の集計と照合</h2><div id="controlBody"></div></section><section class="card" id="masterCard"><h2>振込先マスター照合</h2><div id="masterBody"></div></section><section class="card"><h2>振込準備</h2><div class="summary"><div class="stat"><b id="count">0</b>振込対象</div><div class="stat"><b id="total">0円</b>振込合計</div><div class="stat"><b id="checkCount">0</b>要確認</div></div><div id="list"></div></section></main><script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',KEY='companyPaymentPrepV3',CK='companyPaymentControlV2',MK='bankTransferRecipientsV1',AK='bankTransferRecipientAliasesV1',NK='bankTransferSupplierNameCorrectionsV1';let rows=JSON.parse(localStorage.getItem(KEY)||'[]'),control=JSON.parse(localStorage.getItem(CK)||'null');const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ja-JP')+'円';function norm(s){return String(s||'').normalize('NFKC').toUpperCase().replace(/株式会社|有限会社|合同会社/g,'').replace(/\(株\)|\(有\)|㈱|㈲/g,'').replace(/[\s　・･.．,，、\-‐―ー_\/\\（）()]/g,'').trim()}function corrections(){try{return JSON.parse(localStorage.getItem(NK)||'{}')}catch{return {}}}function correctedName(s){const c=corrections();return c[norm(s)]||s}function masters(){try{return JSON.parse(localStorage.getItem(MK)||'[]')}catch{return []}}function aliases(){try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch{return {}}}function fp(m){return [m.bank_code,m.branch_code,m.account_type_code,m.account_number,m.account_holder_kana].join('|')}function match(r){const ms=masters(),name=correctedName(r.supplier_name),n=norm(name),a=aliases()[n];if(a){const i=ms.findIndex(m=>fp(m)===a);if(i>=0)return{status:'exact',matches:[{m:ms[i],i,alias:true}]}}const ex=ms.map((m,i)=>({m,i})).filter(x=>norm(x.m.account_holder)===n);if(ex.length===1)return{status:'exact',matches:ex};const cand=ms.map((m,i)=>({m,i})).filter(x=>{const h=norm(x.m.account_holder);return n.length>=3&&(h.includes(n)||n.includes(h))}).slice(0,8);return{status:cand.length?'candidate':'missing',matches:cand}}function confirmRecipient(id,i){const r=rows.find(x=>String(x.id)===String(id)),m=masters()[i];if(!r||!m)return;if(!confirm(`「${correctedName(r.supplier_name)}」を「${m.account_holder||m.account_holder_kana}」の口座として今後も記憶しますか？`))return;const a=aliases();a[norm(correctedName(r.supplier_name))]=fp(m);localStorage.setItem(AK,JSON.stringify(a));render()}function save(){localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(CK,JSON.stringify(control));render()}function needs(r){return !r.supplier_name||!Number(r.amount)||match(r).status!=='exact'}function recipient(r){const x=match(r);if(x.status==='exact'){const m=x.matches[0].m;return `<div class="masterline good">✅ 口座一致　${m.account_holder||m.account_holder_kana}${x.matches[0].alias?'<div class="muted">以前確認した組み合わせを自動使用</div>':''}</div>`}if(x.status==='candidate')return `<div class="masterline"><b>⚠️ この会社の振込先を一度だけ確認</b>${x.matches.map(y=>`<div class="candidate-row">${y.m.account_holder||y.m.account_holder_kana}<br>${y.m.bank_name||''} ${y.m.branch_name||''} 口座 ****${String(y.m.account_number||'').slice(-3)}<br><button data-pick="${r.id}" data-i="${y.i}">この口座で今後も自動照合</button></div>`).join('')}</div>`;return '<div class="masterline">⚠️ マスター名で候補を特定できません</div>'}function reviewHtml(r){const x=match(r),shown=correctedName(r.supplier_name);if(x.status==='candidate')return `<div class="review-item"><div class="review-name">${shown}</div><div class="muted">振込金額 ${money(r.amount)}</div>${x.matches.map(y=>`<div class="candidate-row"><b>${y.m.account_holder||y.m.account_holder_kana}</b><br>${y.m.bank_name||''} ${y.m.branch_name||''} 口座 ****${String(y.m.account_number||'').slice(-3)}<br><button data-pick="${r.id}" data-i="${y.i}">この口座で今後も自動照合</button></div>`).join('')}</div>`;return `<div class="review-item"><div class="review-name">${shown}</div><div class="muted">振込金額 ${money(r.amount)}</div><div class="masterline">マスター名で候補を特定できません。下の支払先名を直して「修正を保存」してください。</div></div>`}function bind(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>confirmRecipient(b.dataset.pick,Number(b.dataset.i)));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const box=b.closest('.item'),r=rows.find(x=>String(x.id)===String(b.dataset.save)),old=r.supplier_name;const ni=box.querySelector('[data-k="supplier_name"]'),ai=box.querySelector('[data-k="amount"]'),neu=ni.value.trim();if(neu&&norm(old)!==norm(neu)){const c=corrections();c[norm(old)]=neu;localStorage.setItem(NK,JSON.stringify(c))}r.supplier_name=neu;r.amount=Number(ai.value.replace(/\D/g,''))||null;save()})}function render(){const total=rows.reduce((s,r)=>s+(Number(r.amount)||0),0),unresolved=rows.filter(needs);$('count').textContent=rows.length;$('total').textContent=money(total);$('checkCount').textContent=unresolved.length;const ok=control&&Number(control.control_count)===rows.length&&Number(control.control_total)===total&&!control.page_mismatch;$('controlBody').innerHTML=control?`<b>${ok?'✅ 全体・ページとも一致':'⚠️ 集計を確認してください'}</b><p>${rows.length}件・${money(total)}</p>`:'<span class="muted">読取後に自動照合します。</span>';let exact=rows.filter(r=>match(r).status==='exact').length;$('masterBody').innerHTML=`<b>${exact===rows.length&&rows.length?'✅ 全件の振込先を特定できました':`⚠️ 要確認 ${unresolved.length}件`}</b><p class="muted">口座一致 ${exact} / ${rows.length}　マスター ${masters().length}件</p>`;$('reviewCard').style.display=unresolved.length?'block':'none';$('reviewBody').innerHTML=unresolved.length?unresolved.map(reviewHtml).join(''):'<b>要確認はありません。</b>';const ordered=[...rows].sort((a,b)=>Number(needs(b))-Number(needs(a)));$('list').innerHTML=ordered.map(r=>{const shown=correctedName(r.supplier_name);return `<div class="item" data-id="${r.id}"><b>${shown}</b> <span class="pill ${needs(r)?'':'ok'}">${needs(r)?'要確認':'振込準備OK'}</span>${shown!==r.supplier_name?`<div class="muted">AI読取「${r.supplier_name}」→ 記憶済み訂正「${shown}」</div>`:''}${recipient(r)}<div class="fields"><div class="field"><label>支払先</label><input data-k="supplier_name" value="${shown}"></div><div class="field"><label>振込金額</label><input data-k="amount" value="${r.amount||''}"></div></div><button data-save="${r.id}">修正を保存</button></div>`}).join('');bind()}function dataUrl(f){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=()=>rej(rd.error);rd.readAsDataURL(f)})}let timer,start;function startP(){start=Date.now();$('progress').style.display='block';timer=setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);$('progressText').textContent=s<50?'AIが各ページを読み取っています':s<100?'件数・金額を照合しています':'最終確認中です';$('progressBar').style.width=Math.min(92,8+s*.55)+'%';$('progressTime').textContent=`経過 ${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒 ／ ${s<70?'通常あと30秒〜1分30秒程度':'完了まで少しお待ちください'}`},1000)}function stopP(){clearInterval(timer);const s=Math.floor((Date.now()-start)/1000);$('progressBar').style.width='100%';$('progressText').textContent='✅ AI読取・照合完了';$('progressTime').textContent=`完了まで ${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒`}$('register').onclick=async function(){const fs=[...$('files').files];if(!fs.length)return alert('ファイルを選択してください');this.disabled=true;startP();try{const files=[];for(const f of fs)files.push({name:f.name,type:f.type||'application/octet-stream',data:await dataUrl(f)});const resp=await fetch(`${U}/functions/v1/read-invoice`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({files})});const d=await resp.json();if(!resp.ok)throw Error(d.error||'AI読取エラー');const names=new Set(fs.map(f=>f.name));rows=rows.filter(x=>!names.has(x.source_name));for(const x of d.invoices||[]){const original=x.supplier_name;x.supplier_name=correctedName(original);rows.push({id:Date.now()+Math.random(),...x})}const pc=(d.controls||[]).flatMap(c=>c.page_checks||[]);control=d.control?{...d.control,page_checks:pc}:null;save();stopP();$('readStatus').textContent=`${rows.length}件・${money(rows.reduce((s,x)=>s+(Number(x.amount)||0),0))}を抽出しました。`}catch(e){clearInterval(timer);alert(e.message)}finally{this.disabled=false}};render();
</script></body></html>
