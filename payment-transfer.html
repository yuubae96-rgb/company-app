<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>支払・振込準備</title><style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#20242a;--muted:#68707b;--line:#d9dee5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#20252b;color:#fff;padding:20px 18px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#d5d9df;font-size:13px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 2px 9px #0000000a}h2{font-size:19px;margin:0 0 10px}.lead{font-size:18px;font-weight:800;margin:0 0 5px}.muted{font-size:13px;color:var(--muted);line-height:1.6}.drop{margin-top:14px;padding:24px 14px;border:2px dashed #b9c1cb;border-radius:14px;text-align:center;background:#fafbfc}.drop strong{display:block;font-size:17px;margin-bottom:7px}.drop input{max-width:100%}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.primary{width:100%;background:#20252b;color:#fff;margin-top:12px}.secondary{background:#e9edf2;color:#222}.danger{background:#fff0f0;color:#9b1c1c}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{padding:12px;background:#f5f7fa;border-radius:11px;text-align:center}.stat b{display:block;font-size:20px}.control{border:2px solid #d7dde5}.okbox{border-color:#6fba82;background:#f4fbf6}.badbox{border-color:#df8f8f;background:#fff7f7}.control-grid,.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control-side{padding:13px;border-radius:11px;background:#fff;border:1px solid #e1e5ea}.control-side b{display:block;font-size:21px;margin-top:4px}.pagecheck{padding:10px 0;border-top:1px solid #e5e8ec;font-size:13px;line-height:1.6}.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:#eef2f7}.warn{background:#fff1cf}.ok{background:#e8f7ec}.item{padding:15px 0;border-bottom:1px solid #e7eaee}.field label{display:block;font-size:12px;font-weight:700;color:#59616d;margin-bottom:4px}.field input{width:100%;border:1px solid #cfd5dc;border-radius:9px;padding:9px;font-size:15px}.actions{display:flex;gap:8px;margin-top:9px}.actions button{padding:9px 12px;font-size:13px}.errorbox{display:none;margin-top:12px;padding:12px;border:1px solid #e5a0a0;border-radius:10px;background:#fff5f5;color:#8a1717;font-size:13px;white-space:pre-wrap}.masterline{margin-top:8px;padding:10px 11px;border-radius:10px;background:#f7f8fa;font-size:13px;line-height:1.6}.masterline.good{background:#eff9f2}.masterline.candidate,.masterline.missing{background:#fff7df;border:1px solid #eadfb7}.candidate-row{padding:9px 0;border-top:1px solid #eadfb7}.candidate-row button{padding:8px 11px;font-size:13px;background:#20252b;color:#fff}.alias-note{margin-top:5px;font-size:12px;color:#4d6b56}.progressbox{display:none;margin-top:12px;padding:14px;border-radius:12px;background:#eef5ff;border:1px solid #c8d9f0}.progressbar{height:9px;background:#dce5ef;border-radius:99px;overflow:hidden;margin:9px 0}.progressbar span{display:block;height:100%;background:#4d719c;width:8%;transition:width .8s}.progressbig{font-size:17px;font-weight:800}@media(max-width:600px){.summary,.fields,.control-grid{grid-template-columns:1fr}}
</style></head><body><header><h1>支払・振込準備</h1><p>支払一覧をAIで読み取り、銀行振込する行だけを抽出</p></header><main>
<section class="card"><p class="lead">支払一覧・請求書PDFを入れてください</p><div class="drop"><strong>PDF / 画像を選択</strong><input id="files" type="file" multiple accept="application/pdf,image/*"></div><button class="primary" id="register">AIで振込対象を読み取る</button><div id="progress" class="progressbox"><div id="progressText" class="progressbig">AI読取を開始しています…</div><div class="progressbar"><span id="progressBar"></span></div><div id="progressTime" class="muted"></div></div><div id="readStatus" class="muted"></div><div id="errorBox" class="errorbox"></div></section>
<section class="card control" id="controlCard"><h2>経理の集計と照合</h2><div id="controlBody"></div></section><section class="card control" id="masterCard"><h2>振込先マスター照合</h2><div id="masterBody"></div></section><section class="card"><h2>振込準備</h2><div class="summary"><div class="stat"><b id="count">0</b><span class="muted">振込対象</span></div><div class="stat"><b id="total">0円</b><span class="muted">振込合計</span></div><div class="stat"><b id="checkCount">0</b><span class="muted">要確認</span></div></div><div id="list"></div></section></main><script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa';const KEY='companyPaymentPrepV3',CK='companyPaymentControlV2',MK='bankTransferRecipientsV1',MM='bankTransferRecipientsMetaV1',AK='bankTransferRecipientAliasesV1';let rows=JSON.parse(localStorage.getItem(KEY)||'[]'),control=JSON.parse(localStorage.getItem(CK)||'null');const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ja-JP')+'円',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function normName(s){return String(s||'').normalize('NFKC').toUpperCase().replace(/株式会社|有限会社|合同会社|合資会社|合名会社/g,'').replace(/\(株\)|\(有\)|㈱|㈲/g,'').replace(/[\s　・･.．,，、\-‐―ー_\/\\（）()]/g,'').trim()}function masterRows(){try{return JSON.parse(localStorage.getItem(MK)||'[]')}catch{return []}}function aliases(){try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch{return {}}}function fingerprint(m){return [m.bank_code,m.branch_code,m.account_type_code,m.account_number,m.account_holder_kana].join('|')}function matchRecipient(r){const ms=masterRows(),n=normName(r.supplier_name),a=aliases()[n];if(a){const i=ms.findIndex(m=>fingerprint(m)===a);if(i>=0)return {status:'exact',matches:[{m:ms[i],i,alias:true}]}}const ex=ms.map((m,i)=>({m,i})).filter(x=>normName(x.m.account_holder)===n);if(ex.length===1)return {status:'exact',matches:ex};const terms=n.length>=3?[n,n.replace(/電工/g,''),n.replace(/商店/g,'')]:[n];const cand=ms.map((m,i)=>({m,i,score:Math.max(...terms.map(t=>{const h=normName(m.account_holder);return h===t?100:(h.includes(t)||t.includes(h))&&Math.min(h.length,t.length)>=3?90:0}))})).filter(x=>x.score>0).slice(0,8);return {status:cand.length?'candidate':'missing',matches:cand}}
function confirmRecipient(rowId,index){const r=rows.find(x=>String(x.id)===String(rowId)),m=masterRows()[index];if(!r||!m)return;if(!confirm(`「${r.supplier_name}」を「${m.account_holder||m.account_holder_kana}」の口座として今後も記憶しますか？`))return;const a=aliases();a[normName(r.supplier_name)]=fingerprint(m);localStorage.setItem(AK,JSON.stringify(a));render()}
function needsCheck(r){return !r.supplier_name||!Number(r.amount)||matchRecipient(r).status!=='exact'}function save(){localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(CK,JSON.stringify(control));render()}
function renderControl(total){if(!control){$('controlBody').innerHTML='<p class="muted">読取後に自動照合します。</p>';return}const ok=Number(control.control_count)===rows.length&&Number(control.control_total)===total&&!control.page_mismatch;$('controlCard').className='card control '+(ok?'okbox':'badbox');$('controlBody').innerHTML=`<strong>${ok?'✅ 全体・ページとも一致':'⚠️ 集計を確認してください'}</strong><p>${rows.length}件・${money(total)}</p>`}
function renderMaster(){const ms=masterRows();let exact=0,cand=0,miss=0;rows.forEach(r=>{const x=matchRecipient(r);x.status==='exact'?exact++:x.status==='candidate'?cand++:miss++});const ok=rows.length>0&&exact===rows.length;$('masterCard').className='card control '+(ok?'okbox':'badbox');$('masterBody').innerHTML=`<div class="summary"><div class="stat"><b>${exact}</b>口座一致</div><div class="stat"><b>${cand}</b>候補あり</div><div class="stat"><b>${miss}</b>確認必要</div></div><p><strong>${ok?'✅ 全件の振込先を特定できました':'⚠️ 未確定だけ下で確認してください'}</strong></p><div class="muted">マスター ${ms.length}件</div>`}
function recipientHtml(r){const x=matchRecipient(r);if(x.status==='exact'){const m=x.matches[0].m;return `<div class="masterline good"><strong>✅ 口座一致</strong> ${esc(m.account_holder||m.account_holder_kana)}${x.matches[0].alias?'<div class="alias-note">以前確認した組み合わせを自動使用</div>':''}</div>`}if(x.status==='candidate')return `<div class="masterline candidate"><strong>⚠️ この会社の振込先を一度だけ確認</strong>${x.matches.map(y=>`<div class="candidate-row"><strong>${esc(y.m.account_holder||y.m.account_holder_kana)}</strong><br>${esc(y.m.bank_name)} ${esc(y.m.branch_name)} 口座 ****${esc(String(y.m.account_number||'').slice(-3))}<br><button data-pick-row="${r.id}" data-pick-index="${y.i}">この口座で今後も自動照合</button></div>`).join('')}</div>`;return `<div class="masterline missing"><strong>⚠️ マスター名で候補を特定できません</strong><br><span class="muted">マスター登録名を確認してください。</span></div>`}
function render(){const total=rows.reduce((s,r)=>s+(Number(r.amount)||0),0);$('count').textContent=rows.length;$('total').textContent=money(total);$('checkCount').textContent=rows.filter(needsCheck).length;renderControl(total);renderMaster();$('list').innerHTML=rows.map(r=>`<div class="item" data-id="${r.id}"><strong>${esc(r.supplier_name)}</strong> <span class="pill ${needsCheck(r)?'warn':'ok'}">${needsCheck(r)?'要確認':'振込準備OK'}</span>${recipientHtml(r)}<div class="fields"><div class="field"><label>支払先</label><input data-k="supplier_name" value="${esc(r.supplier_name)}"></div><div class="field"><label>振込金額</label><input data-k="amount" value="${esc(r.amount)}"></div></div><div class="actions"><button class="secondary" data-save="${r.id}">修正を保存</button><button class="danger" data-del="${r.id}">削除</button></div></div>`).join('');document.querySelectorAll('[data-pick-row]').forEach(b=>b.onclick=()=>confirmRecipient(b.dataset.pickRow,Number(b.dataset.pickIndex)));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const box=b.closest('.item'),r=rows.find(x=>String(x.id)===String(b.dataset.save));box.querySelectorAll('[data-k]').forEach(i=>r[i.dataset.k]=i.dataset.k==='amount'?Number(i.value.replace(/\D/g,'')):i.value.trim());save()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('削除しますか？')){rows=rows.filter(x=>String(x.id)!==String(b.dataset.del));save()}})}
function dataUrl(f){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=()=>rej(rd.error);rd.readAsDataURL(f)})}function showError(msg){$('errorBox').style.display='block';$('errorBox').textContent='AI読取に失敗しました\n'+msg}let timer=null,start=0;function startProgress(){start=Date.now();$('progress').style.display='block';timer=setInterval(()=>{const sec=Math.floor((Date.now()-start)/1000),m=Math.floor(sec/60),s=sec%60;let pct=Math.min(92,8+sec*.55),phase=sec<15?'PDFを送信・読取準備中':sec<50?'AIが各ページを読み取っています':sec<100?'件数・金額を照合しています':'最終確認中です';$('progressText').textContent=phase;$('progressBar').style.width=pct+'%';const estimate=sec<20?'通常あと1〜2分程度':sec<70?'通常あと30秒〜1分30秒程度':'完了まで少しお待ちください';$('progressTime').textContent=`経過 ${m}分${String(s).padStart(2,'0')}秒　／　${estimate}`},1000)}function stopProgress(){clearInterval(timer);timer=null;$('progressBar').style.width='100%';$('progressText').textContent='✅ AI読取・照合完了';const sec=Math.floor((Date.now()-start)/1000);$('progressTime').textContent=`完了まで ${Math.floor(sec/60)}分${String(sec%60).padStart(2,'0')}秒`}
$('register').onclick=async function(){const fs=[...$('files').files];if(!fs.length)return alert('ファイルを選択してください');this.disabled=true;this.textContent='AIで照合中…';$('errorBox').style.display='none';startProgress();try{const files=[];for(const f of fs)files.push({name:f.name,type:f.type||'application/octet-stream',data:await dataUrl(f)});const resp=await fetch(`${U}/functions/v1/read-invoice`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({files})});const raw=await resp.text();let d;try{d=JSON.parse(raw)}catch{}if(!resp.ok)throw new Error(d?.error||`HTTP ${resp.status}`);const names=new Set(fs.map(f=>f.name));rows=rows.filter(x=>!names.has(x.source_name));for(const x of d.invoices||[])rows.push({id:Date.now()+Math.random(),...x});const page_checks=(d.controls||[]).flatMap(c=>c.page_checks||[]);control=d.control?{...d.control,page_checks}:null;save();$('files').value='';stopProgress();$('readStatus').textContent=`${rows.length}件・${money(rows.reduce((s,x)=>s+(Number(x.amount)||0),0))}を抽出しました。`;}catch(e){clearInterval(timer);showError(e.message||String(e));$('progressText').textContent='読取を完了できませんでした'}finally{this.disabled=false;this.textContent='AIで振込対象を読み取る'}};render();
</script></body></html>
