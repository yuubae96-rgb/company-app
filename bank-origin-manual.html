<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>振込元情報 手入力</title><style>body{margin:0;background:#f3f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcc4ce;border-radius:9px;font-size:16px}.primary{width:100%;border:0;border-radius:12px;padding:15px;background:#176b31;color:#fff;font-size:17px;font-weight:800;margin-top:16px;cursor:pointer}.status{margin-top:12px;padding:12px;border-radius:10px;font-weight:700}.muted{color:#68707b;font-size:13px;line-height:1.6}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>振込元情報を手入力</h1><p class="muted">AI読取を使わず、振込元情報だけを直接入力できます。必須項目が不足・桁数不正の場合は保存できません。AIによる推測補完はしません。</p><div class="grid"><div class="field"><label>振込依頼人コード（10桁）</label><input id="client" inputmode="numeric" maxlength="10"></div><div class="field"><label>振込依頼人名（カナ）</label><input id="clientName"></div><div class="field"><label>仕向銀行コード（4桁）</label><input id="bankCode" inputmode="numeric" maxlength="4"></div><div class="field"><label>仕向銀行名（カナ）</label><input id="bankName" value="ｷﾀｷﾕｳｼﾕｳ"></div><div class="field"><label>仕向支店コード（3桁）</label><input id="branchCode" inputmode="numeric" maxlength="3"></div><div class="field"><label>仕向支店名（カナ）</label><input id="branchName"></div><div class="field"><label>振込元口座種別</label><select id="type"><option value="1">普通</option><option value="2">当座</option><option value="9">その他</option></select></div><div class="field"><label>振込元口座番号（7桁以内）</label><input id="account" inputmode="numeric" maxlength="7"></div></div><button class="primary" id="save">入力内容を確認して保存</button><div id="status"></div></section></main><script>const SK='kitakyushuZenginSetupV1',$=id=>document.getElementById(id);let old={};try{old=JSON.parse(localStorage.getItem(SK)||'{}')}catch{};for(const k of ['client','clientName','bankCode','bankName','branchCode','branchName','type','account'])if(old[k]!=null&&String(old[k])!=='')$(k).value=old[k];function val(){return{client:$('client').value.trim(),clientName:$('clientName').value.trim(),bankCode:$('bankCode').value.trim(),bankName:$('bankName').value.trim(),branchCode:$('branchCode').value.trim(),branchName:$('branchName').value.trim(),type:$('type').value,account:$('account').value.trim()}}function missing(s){const a=[];if(!/^\d{10}$/.test(s.client))a.push('振込依頼人コード（10桁）');if(!s.clientName)a.push('振込依頼人名');if(!/^\d{4}$/.test(s.bankCode))a.push('仕向銀行コード（4桁）');if(!s.bankName)a.push('仕向銀行名');if(!/^\d{3}$/.test(s.branchCode))a.push('仕向支店コード（3桁）');if(!s.branchName)a.push('仕向支店名');if(!['1','2','9'].includes(s.type))a.push('口座種別');if(!/^\d{1,7}$/.test(s.account))a.push('振込元口座番号（7桁以内）');return a}$('save').onclick=()=>{const s=val(),m=missing(s),st=$('status');st.className='status';if(m.length){st.style.background='#fff1df';st.textContent='⚠️ 保存できません。不足・不正：'+m.join('、');return}localStorage.setItem(SK,JSON.stringify(s));st.style.background='#edf9f0';st.textContent='✅ 振込元情報を保存しました。銀行振込画面に戻って続けられます。';setTimeout(()=>location.href='bank-transfer-app.html?v=20260910-1700',900)};</script></body></html>
