<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>振込先マスター</title><style>
body{margin:0;background:#f3f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#20252b;color:#fff;padding:20px 18px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#d5d9df;font-size:13px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9dee5;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 2px 9px #0000000a}.lead{font-size:18px;font-weight:800;margin:0 0 5px}.muted{font-size:13px;color:#68707b;line-height:1.6}.drop{margin-top:14px;padding:24px 14px;border:2px dashed #b9c1cb;border-radius:14px;text-align:center;background:#fafbfc}.drop strong{display:block;font-size:17px;margin-bottom:7px}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.primary{width:100%;background:#20252b;color:#fff;margin-top:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:12px;background:#f5f7fa;border-radius:11px;text-align:center}.stat b{display:block;font-size:22px}.ok{border:2px solid #6fba82;background:#f4fbf6}.item{padding:12px 0;border-top:1px solid #e7eaee}.item:first-child{border-top:0}.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:#e8f7ec}.masked{font-family:monospace}.danger{width:100%;margin-top:10px;background:#fff0f0;color:#9b1c1c}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field label{display:block;font-size:12px;font-weight:700;color:#59616d;margin-bottom:4px}.field input,.field select{width:100%;box-sizing:border-box;border:1px solid #cfd5dc;border-radius:9px;padding:10px;font-size:15px;background:#fff}.wide{grid-column:1/-1}.success{color:#18733b;font-weight:700;margin-top:10px}@media(max-width:600px){.summary,.fields{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body>
<header><h1>振込先マスター</h1><p>北九州銀行CSVをこの端末の中だけに保存</p></header><main>
<section class="card"><p class="lead">北九州銀行の振込先CSVを入れてください</p><p class="muted">銀行口座データはSupabaseやGitHubへ送らず、このブラウザの保存領域だけに保持します。一度登録すれば、同じ端末では次回から会社名で自動照合できます。</p><div class="drop"><strong>CSVを選択</strong><input id="csv" type="file" accept=".csv,text/csv"></div><button class="primary" id="importBtn">振込先マスターを登録</button><div id="status" class="muted"></div></section>
<section class="card"><p class="lead">新規の振込先を1件だけ追加</p><p class="muted">銀行コード・支店コードが既存300件にあれば、全銀用の銀行名カナ・支店名カナは自動補完します。初めて出てくる銀行・支店だけカナを入力してください。全角カナでも自動で半角へ変換します。</p><div class="fields"><div class="field wide"><label>会社名・口座名義（漢字）</label><input id="oneHolder" placeholder="例：株式会社○○"></div><div class="field"><label>銀行名</label><input id="oneBank" placeholder="例：福岡銀行"></div><div class="field"><label>銀行コード（4桁）</label><input id="oneBankCode" inputmode="numeric" maxlength="4" placeholder="例：0177"></div><div class="field"><label>銀行名カナ（通常は自動）</label><input id="oneBankKana" placeholder="例：ﾌｸｵｶ"></div><div class="field"><label>支店名</label><input id="oneBranch" placeholder="例：黒崎支店"></div><div class="field"><label>支店コード（3桁）</label><input id="oneBranchCode" inputmode="numeric" maxlength="3" placeholder="例：123"></div><div class="field"><label>支店名カナ（通常は自動）</label><input id="oneBranchKana" placeholder="例：ｸﾛｻｷ"></div><div class="field"><label>口座種別</label><select id="oneType"><option value="普通">普通</option><option value="当座">当座</option></select></div><div class="field"><label>口座番号</label><input id="oneAccount" inputmode="numeric" maxlength="7" placeholder="7桁"></div><div class="field wide"><label>口座名義（カナ）</label><input id="oneKana" placeholder="銀行登録どおりのカナ"></div></div><button class="primary" id="addOneBtn">この1件をマスターに追加・更新</button><div id="oneStatus" class="muted"></div></section>
<section class="card" id="summaryCard"><h2>登録状況</h2><div class="summary"><div class="stat"><b id="count">0</b><span class="muted">登録件数</span></div><div class="stat"><b id="date">未登録</b><span class="muted">最終登録</span></div></div></section>
<section class="card"><h2>登録例</h2><div id="list"><p class="muted">まだ登録されていません。</p></div><button class="danger" id="clearBtn">この端末の振込先マスターを削除</button></section>
</main><script>
const KEY='bankTransferRecipientsV1',META='bankTransferRecipientsMetaV1';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const kanaMap={"ガ":"ｶﾞ","ギ":"ｷﾞ","グ":"ｸﾞ","ゲ":"ｹﾞ","ゴ":"ｺﾞ","ザ":"ｻﾞ","ジ":"ｼﾞ","ズ":"ｽﾞ","ゼ":"ｾﾞ","ゾ":"ｿﾞ","ダ":"ﾀﾞ","ヂ":"ﾁﾞ","ヅ":"ﾂﾞ","デ":"ﾃﾞ","ド":"ﾄﾞ","バ":"ﾊﾞ","ビ":"ﾋﾞ","ブ":"ﾌﾞ","ベ":"ﾍﾞ","ボ":"ﾎﾞ","パ":"ﾊﾟ","ピ":"ﾋﾟ","プ":"ﾌﾟ","ペ":"ﾍﾟ","ポ":"ﾎﾟ","ヴ":"ｳﾞ","ア":"ｱ","イ":"ｲ","ウ":"ｳ","エ":"ｴ","オ":"ｵ","カ":"ｶ","キ":"ｷ","ク":"ｸ","ケ":"ｹ","コ":"ｺ","サ":"ｻ","シ":"ｼ","ス":"ｽ","セ":"ｾ","ソ":"ｿ","タ":"ﾀ","チ":"ﾁ","ツ":"ﾂ","テ":"ﾃ","ト":"ﾄ","ナ":"ﾅ","ニ":"ﾆ","ヌ":"ﾇ","ネ":"ﾈ","ノ":"ﾉ","ハ":"ﾊ","ヒ":"ﾋ","フ":"ﾌ","ヘ":"ﾍ","ホ":"ﾎ","マ":"ﾏ","ミ":"ﾐ","ム":"ﾑ","メ":"ﾒ","モ":"ﾓ","ヤ":"ﾔ","ユ":"ﾕ","ヨ":"ﾖ","ラ":"ﾗ","リ":"ﾘ","ル":"ﾙ","レ":"ﾚ","ロ":"ﾛ","ワ":"ﾜ","ヲ":"ｦ","ン":"ﾝ","ァ":"ｧ","ィ":"ｨ","ゥ":"ｩ","ェ":"ｪ","ォ":"ｫ","ッ":"ｯ","ャ":"ｬ","ュ":"ｭ","ョ":"ｮ","ー":"ｰ"};
function toHankaku(s){return String(s??'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').replace(/[ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィゥェォッャュョー]/g,ch=>kanaMap[ch]||ch)}
function parseCSV(text){const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))out.push(row);row=[];}else cell+=c;}if(cell!==''||row.length){row.push(cell);out.push(row);}return out;}
function normalize(h){return String(h||'').replace(/\s/g,'').replace(/Ｅ/g,'E').replace(/Ｄ/g,'D').replace(/Ｉ/g,'I')}
function nowText(){const now=new Date();return `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`}
function rowsNow(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function render(){const rows=rowsNow(),meta=JSON.parse(localStorage.getItem(META)||'null');$('count').textContent=rows.length;$('date').textContent=meta?.date||'未登録';$('summaryCard').classList.toggle('ok',rows.length>0);$('list').innerHTML=rows.length?rows.slice(-8).reverse().map(r=>`<div class="item"><strong>${esc(r.account_holder||r.account_holder_kana||'名称なし')}</strong> <span class="pill">${esc(r.bank_name||'')} ${esc(r.branch_name||'')}</span><div class="muted">${esc(r.account_type||'')}　<span class="masked">口座 ****${esc(String(r.account_number||'').slice(-3))}</span></div></div>`).join(''):'<p class="muted">まだ登録されていません。</p>';}
function autofillKana(){const rows=rowsNow(),bc=$('oneBankCode').value.trim(),br=$('oneBranchCode').value.trim();if(bc&&!$('oneBankKana').value.trim()){const x=rows.find(r=>String(r.bank_code)===bc&&r.bank_name_kana);if(x)$('oneBankKana').value=x.bank_name_kana}if(bc&&br&&!$('oneBranchKana').value.trim()){const x=rows.find(r=>String(r.bank_code)===bc&&String(r.branch_code)===br&&r.branch_name_kana);if(x)$('oneBranchKana').value=x.branch_name_kana}}
$('oneBankCode').addEventListener('change',autofillKana);$('oneBranchCode').addEventListener('change',autofillKana);
$('importBtn').onclick=async()=>{const f=$('csv').files[0];if(!f)return alert('CSVを選択してください');$('status').textContent='CSVを読んでいます…';try{const buf=await f.arrayBuffer();let text='';try{text=new TextDecoder('shift_jis').decode(buf)}catch{text=new TextDecoder('utf-8').decode(buf)}const grid=parseCSV(text);if(grid.length<2)throw new Error('CSVの中身を読めませんでした');const headers=grid[0].map(normalize);const idx=name=>headers.findIndex(h=>h===normalize(name));const need=['金融機関コード','金融機関名（漢字）','支店コード','支店名（漢字）','科目','口座番号','口座名（カナ）','口座名（漢字）'];for(const n of need)if(idx(n)<0)throw new Error(`必要な列がありません: ${n}`);const rows=grid.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>({recipient_code1:r[idx('振込先コード１')]||'',recipient_code2:r[idx('振込先コード２')]||'',bank_code:r[idx('金融機関コード')]||'',bank_name_kana:toHankaku(r[idx('金融機関名（カナ）')]||''),bank_name:r[idx('金融機関名（漢字）')]||'',branch_code:r[idx('支店コード')]||'',branch_name_kana:toHankaku(r[idx('支店名（カナ）')]||''),branch_name:r[idx('支店名（漢字）')]||'',account_type_code:r[idx('科目コード')]||'',account_type:r[idx('科目')]||'',account_number:r[idx('口座番号')]||'',account_holder_kana:toHankaku(r[idx('口座名（カナ）')]||''),account_holder:r[idx('口座名（漢字）')]||'',fee_type:r[idx('手数料負担区分')]||'',identification:r[idx('識別表示')]||'',edi_info:r[idx('EDI情報')]||r[idx('ＥＤＩ情報')]||''}));if(!rows.length)throw new Error('振込先が0件でした');localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(META,JSON.stringify({date:nowText(),file:f.name,count:rows.length}));$('status').textContent=`${rows.length}件をこの端末に登録しました。`;render();}catch(e){$('status').textContent=`登録できませんでした: ${e.message||e}`}}
$('addOneBtn').onclick=()=>{autofillKana();const holder=$('oneHolder').value.trim(),bank=$('oneBank').value.trim(),bankCode=$('oneBankCode').value.trim(),bankKana=toHankaku($('oneBankKana').value.trim()),branch=$('oneBranch').value.trim(),branchCode=$('oneBranchCode').value.trim(),branchKana=toHankaku($('oneBranchKana').value.trim()),type=$('oneType').value,account=$('oneAccount').value.replace(/\D/g,''),kana=toHankaku($('oneKana').value.trim());const st=$('oneStatus');if(!holder||!bank||!bankCode||!branch||!branchCode||!account||!kana){st.textContent='未入力があります。会社名・銀行・コード・支店・口座番号・口座名義カナを入力してください。';return}if(!bankKana){st.textContent='この銀行は既存マスターに無いため、銀行名カナだけ入力してください。';return}if(!branchKana){st.textContent='この支店は既存マスターに無いため、支店名カナだけ入力してください。';return}if(!/^\d{4}$/.test(bankCode)){st.textContent='銀行コードは4桁で入力してください。';return}if(!/^\d{3}$/.test(branchCode)){st.textContent='支店コードは3桁で入力してください。';return}if(!/^\d{1,7}$/.test(account)){st.textContent='口座番号は7桁以内の数字で入力してください。';return}let rows=rowsNow();const same=rows.findIndex(r=>String(r.bank_code)===bankCode&&String(r.branch_code)===branchCode&&String(r.account_type)===type&&String(r.account_number).replace(/^0+/,'')===account.replace(/^0+/,''));const obj={recipient_code1:'',recipient_code2:'',bank_code:bankCode,bank_name_kana:bankKana,bank_name:bank,branch_code:branchCode,branch_name_kana:branchKana,branch_name:branch,account_type_code:type==='当座'?'2':'1',account_type:type,account_number:account.padStart(7,'0'),account_holder_kana:kana,account_holder:holder,fee_type:'',identification:'',edi_info:'',manual:true};if(same>=0){rows[same]={...rows[same],...obj};st.textContent=`${holder} を更新しました。`;}else{rows.push(obj);st.textContent=`${holder} を追加しました。現在 ${rows.length}件です。`;}localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(META,JSON.stringify({date:nowText(),file:'CSV＋手動追加',count:rows.length}));['oneHolder','oneBank','oneBankCode','oneBankKana','oneBranch','oneBranchCode','oneBranchKana','oneAccount','oneKana'].forEach(id=>$(id).value='');render();}
$('clearBtn').onclick=()=>{if(confirm('この端末に保存した振込先マスターを削除しますか？')){localStorage.removeItem(KEY);localStorage.removeItem(META);render();}};render();
</script></body></html>
