name: Video export worker
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Video export job ID
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-export.yml'
      - 'scripts/video-export-worker.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: video-export-${{ inputs.job_id || github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install video renderer
        timeout-minutes: 4
        run: |
          packages=()
          command -v ffmpeg >/dev/null || packages+=(ffmpeg)
          python3 -c 'from PIL import Image, ImageDraw, ImageFont, ImageColor' || packages+=(python3-pil)
          test -r /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc || packages+=(fonts-noto-cjk)
          if (( ${#packages[@]} )); then
            apt_options=(-o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            if ! sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"; then
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
            fi
          fi
      - name: Render queued videos
        env:
          VIDEO_EXPORT_JOB_ID: ${{ inputs.job_id }}
        run: python3 scripts/video-export-worker.py
