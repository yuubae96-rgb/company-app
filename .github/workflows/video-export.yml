name: Video export worker
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Video export job ID
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-export.yml'
      - 'scripts/video-export-worker.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: video-export-${{ inputs.job_id || github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install video renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-pil
      - name: Render queued videos
        env:
          VIDEO_EXPORT_JOB_ID: ${{ inputs.job_id }}
        run: python3 scripts/video-export-worker.py
