name: Prefill narration reading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill-tts-reading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prefill audio reading with narration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('youtube-video-maker.html')
          s = p.read_text()
          old = "${esc(s.ttsNarration||'')}"
          new = "${esc(s.ttsNarration||s.narration||'')}"
          if old not in s:
              raise SystemExit('target pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-video-maker.html
          git commit -m "Prefill narration reading with subtitle text"
          git push
