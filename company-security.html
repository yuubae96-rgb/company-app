<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>会社アプリのパスワード管理</title><style>body{font:16px system-ui;background:#eef2f6;color:#17212b;margin:0}main{max-width:640px;margin:30px auto;padding:20px}section{background:white;padding:24px;border-radius:16px;margin-bottom:18px}h1{font-size:24px}p{line-height:1.7}label{display:block;margin:18px 0 6px}input,button{font:inherit;box-sizing:border-box;padding:14px;border-radius:9px;width:100%;border:1px solid #cbd5e1}button{background:#17212b;color:white;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}a{color:#1663b0}#message{white-space:pre-wrap}table{width:100%;font-size:12px;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}.scroll{overflow:auto}</style></head><body><main><section><h1>会社アプリのパスワード管理</h1><p id="intro">新しいパスワードを2回入力すると、会社管理と営業管理の設定が完了します。</p><p>ログイン用メール：<strong>fuucha96@yahoo.co.jp</strong></p><form id="form"><div id="oldWrap" hidden><label for="old">現在のパスワード</label><input id="old" type="password" autocomplete="current-password"></div><label for="password">新しいパスワード（12〜128文字）</label><input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><label for="confirm">新しいパスワード（確認）</label><input id="confirm" type="password" required autocomplete="new-password"><button id="submit" disabled>このパスワードで設定を完了する</button></form><p id="message" role="status">設定リンクを確認しています…</p><p><a href="./index.html" id="home" hidden>会社アプリを開く</a></p></section><section id="management" hidden><h2>異常の確認</h2><p>直近1時間の記録から、同じ利用者・対象で5分間に100件以上の変更、または20件以上の削除を警告します。</p><p id="alerts" role="status">確認待ち</p><h2>利用記録</h2><p id="reminder"></p><p>データの追加・変更・削除はサーバー側で記録します。画面を開いた記録はブラウザーから送信します。利用者を区別するには、各人の個別アカウントでログインしてください。</p><button id="refresh" type="button">記録を更新</button><div class="scroll"><table><tbody id="events"></tbody></table></div><button id="logout" type="button">この端末からログアウト</button></section></main><script>
'use strict';
const refs=['vnnvuxccazkdzwqjmntz','emauqxftmauvsffdjvyh'];
const parts=new URLSearchParams(location.hash.slice(1));const tokens=[parts.get('company'),parts.get('sales')];
let setup=tokens.every(Boolean),done=[false,false];
if(setup){sessionStorage.removeItem('company-setup-done');sessionStorage.setItem('company-setup-capability',JSON.stringify(tokens));history.replaceState(null,'',location.pathname);}
else{try{const saved=JSON.parse(sessionStorage.getItem('company-setup-capability'));if(saved?.every(Boolean)){tokens[0]=saved[0];tokens[1]=saved[1];setup=true}}catch{}}
if(setup){try{done=JSON.parse(sessionStorage.getItem('company-setup-done')||'[false,false]')}catch{}}
const el=id=>document.getElementById(id),message=el('message');
async function call(i,body,change=false){const r=await fetch('https://'+refs[i]+'.supabase.co/functions/v1/'+(change?'company-password-change':'company-password-setup'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'設定を完了できません');return d}
async function init(){if(setup){try{for(let i=0;i<2;i++)if(!done[i])await call(i,{token:tokens[i],check:true});message.textContent='設定リンクを確認しました。パスワードを決めて入力してください。';el('submit').disabled=false;if(done.some(Boolean))message.textContent='途中まで設定済みです。同じパスワードを入力して残りの設定を完了してください。'}catch(e){message.textContent=e.message;sessionStorage.removeItem('company-setup-capability')}}else{el('intro').textContent='会社管理と営業管理のパスワードを同時に変更します。';el('oldWrap').hidden=false;el('old').required=true;el('submit').textContent='パスワードを変更する';message.textContent='現在のパスワードと新しいパスワードを入力してください。';el('submit').disabled=false;el('management').hidden=false;const script=document.createElement('script');script.src='./security-auth.js?v=20261009-account2';script.onload=()=>setTimeout(loadEvents,500);document.head.appendChild(script)}}
el('form').onsubmit=async e=>{e.preventDefault();const password=el('password').value;if(password.length<12||password.length>128){message.textContent='12〜128文字で設定してください。';return}if(password!==el('confirm').value){message.textContent='2つのパスワードが一致していません。';return}el('submit').disabled=true;message.textContent='設定しています…';try{if(done[0]){const check=await fetch('https://'+refs[0]+'.supabase.co/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:'sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL','Content-Type':'application/json'},body:JSON.stringify({email:'fuucha96@yahoo.co.jp',password})});if(!check.ok)throw Error('先に設定したパスワードと同じものを入力してください');}for(let i=0;i<2;i++){if(done[i])continue;await call(i,setup?{token:tokens[i],password}:{email:'fuucha96@yahoo.co.jp',current_password:el('old').value,password},!setup);done[i]=true;if(setup)sessionStorage.setItem('company-setup-done',JSON.stringify(done));message.textContent=(i+1)+' / 2 完了';}for(const ref of refs)localStorage.removeItem('sb-'+ref+'-auth-token');let loggedIn=true;for(let i=0;i<2;i++){try{const r=await fetch('https://'+refs[i]+'.supabase.co/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:i===0?'sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4','Content-Type':'application/json'},body:JSON.stringify({email:'fuucha96@yahoo.co.jp',password})});const session=await r.json();if(!r.ok||!session.access_token)throw Error();session.expires_at=Math.floor(Date.now()/1000)+Number(session.expires_in||3600);localStorage.setItem('sb-'+refs[i]+'-auth-token',JSON.stringify(session));}catch{loggedIn=false}}sessionStorage.removeItem('company-setup-capability');sessionStorage.removeItem('company-setup-done');el('form').hidden=true;message.textContent=loggedIn?'設定が完了しました。会社アプリを開いて利用できます。':'設定が完了しました。このメールアドレスと、今決めたパスワードで会社アプリにログインできます。';el('home').hidden=false;el('password').value=el('confirm').value=el('old').value='';}catch(e){message.textContent=e.message+'\n完了済みの設定は保持しています。入力を変えずにもう一度押してください。';el('password').readOnly=el('confirm').readOnly=el('old').readOnly=done.some(Boolean);el('submit').disabled=false}};
async function loadEvents(){try{const s=await window.securityRequireSession(refs[0]);const key=JSON.parse(localStorage.getItem('sb-'+refs[0]+'-auth-token'));const headers={apikey:'sb_publishable_xG-tuBgxFGntT1vlbZzuVQ_AZ2Zl8QL',Authorization:'Bearer '+key.access_token};const r=await fetch('https://'+refs[0]+'.supabase.co/rest/v1/company_security_events?select=occurred_at,actor_email,action,resource,source&order=occurred_at.desc&limit=50',{headers});if(!r.ok)throw Error('利用記録を読み込めません');const alertsResponse=await fetch('https://'+refs[0]+'.supabase.co/rest/v1/rpc/company_security_alerts',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:'{}'});if(!alertsResponse.ok)throw Error('異常の確認ができません');const alerts=await alertsResponse.json();el('alerts').textContent=alerts.length?alerts.map(a=>new Date(a.bucket).toLocaleString('ja-JP')+' / '+a.actor_email+' / '+a.resource+' / 変更 '+a.changes+'件・削除 '+a.deletions+'件').join('\n'):'設定した検知条件に該当する記録はありません。';el('alerts').style.color=alerts.length?'#b91c1c':'#166534';const rows=await r.json();el('events').replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const v of [new Date(row.occurred_at).toLocaleString('ja-JP'),row.actor_email||'サーバー処理',row.action,row.resource]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}el('events').appendChild(tr)}const state=await fetch('https://'+refs[0]+'.supabase.co/rest/v1/company_security_state?select=password_changed_at,reminder_days',{headers}).then(r=>r.json());const st=state[0];if(st?.password_changed_at){const next=new Date(Date.parse(st.password_changed_at)+st.reminder_days*86400000);el('reminder').textContent='次回のパスワード見直し：'+next.toLocaleDateString('ja-JP');}}catch(e){message.textContent=e.message}}
el('refresh').onclick=loadEvents;el('logout').onclick=()=>{for(const ref of refs)localStorage.removeItem('sb-'+ref+'-auth-token');location.href='./index.html'};init();
</script></body></html>
