<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自動字幕AI</title><style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202a;--muted:#667085;--line:#d9dee5;--accent:#1769e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
header{background:#1f2328;color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}header a{color:#ddd;text-decoration:none}h1{margin:8px 0 3px;font-size:25px}
main{max-width:820px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000a}
label{display:block;font-weight:800;margin:8px 0}.hint{font-size:13px;color:var(--muted);line-height:1.6}input,textarea,select,button{font:inherit}input[type=file],input[type=password],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white}textarea{min-height:90px}
button{border:0;border-radius:11px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white;width:100%}.secondary{background:#e9eef6;color:#17324d}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:130px}
#stage{position:relative;background:#000;border-radius:12px;overflow:hidden}video{display:block;width:100%;max-height:58vh}.caption{position:absolute;left:5%;right:5%;bottom:7%;text-align:center;color:white;font-weight:900;font-size:clamp(20px,4.5vw,36px);line-height:1.35;text-shadow:0 2px 5px #000,2px 0 3px #000,-2px 0 3px #000;white-space:pre-line}
.seg{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.time{font-size:12px;color:#667085;padding-top:9px}.seg textarea{min-height:52px;padding:8px}.status{padding:10px;border-radius:10px;background:#f5f7fa;font-size:13px;white-space:pre-wrap}.ok{background:#ecfdf3}.err{background:#fff1f1;color:#9b1c1c}
</style></head><body><header><div style="max-width:820px;margin:auto"><a href="index.html">‹ 会社アプリ</a><h1>自動字幕AI</h1><div style="color:#cfd4da;font-size:13px">動画を入れるだけで、音声認識 → 字幕タイミング → 読みやすい2行字幕</div></div></header>
<main>
<div class="card"><label>1. 動画を選択</label><input id="file" type="file" accept="video/*">
<label>OpenAI APIキー</label><input id="key" type="password" placeholder="sk-..."><div class="hint">キーはこの端末の処理にだけ使用し、保存しません。</div>
<label>固有名詞・専門用語（任意）</label><textarea id="terms" placeholder="例：武則天、高宗、則天武后、村上製作所、カラーアルマイト"></textarea>
<button id="run" class="primary">字幕を自動生成</button><div id="status" class="status" style="margin-top:10px">動画を選んでください。</div></div>
<div class="card"><div id="stage"><video id="video" controls playsinline></video><div id="caption" class="caption"></div></div></div>
<div class="card"><div class="row"><button id="srt" class="secondary">SRTを保存</button><button id="vtt" class="secondary">VTTを保存</button></div><div class="hint" style="margin-top:8px">字幕は最大2行。意味の途中で切れにくい長さに自動調整します。下の文章は手直しでき、プレビューにも即反映されます。</div><div id="list"></div></div>
</main>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script><script>
const $=id=>document.getElementById(id); let cues=[]; let objectUrl='';
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);$('video').src=objectUrl;setStatus(f.name+' を読み込みました。字幕生成を押してください。')};
function setStatus(t,type=''){const e=$('status');e.textContent=t;e.className='status '+type}
function fmt(s,sep=','){s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60),ms=Math.round((s-Math.floor(s))*1000);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+sep+String(ms).padStart(3,'0')}
function wrap2(t){t=t.replace(/\s+/g,'').trim();if(t.length<=22)return t;let cut=Math.ceil(t.length/2);const marks='、。！？!?・）』」';for(let d=0;d<7;d++){for(const p of [cut+d,cut-d])if(p>0&&marks.includes(t[p-1]))return t.slice(0,p)+'\n'+t.slice(p)}return t.slice(0,cut)+'\n'+t.slice(cut)}
function render(){const box=$('list');box.innerHTML='';cues.forEach((c,i)=>{const d=document.createElement('div');d.className='seg';d.innerHTML='<div class="time">'+fmt(c.start,'.')+'<br>〜 '+fmt(c.end,'.')+'</div><textarea data-i="'+i+'"></textarea>';const ta=d.querySelector('textarea');ta.value=c.text;ta.oninput=()=>{cues[i].text=ta.value};box.appendChild(d)})}
$('video').ontimeupdate=()=>{const t=$('video').currentTime,c=cues.find(x=>t>=x.start&&t<x.end);$('caption').textContent=c?wrap2(c.text):''}
async function extractAudio(file){if(!window.FFmpeg)throw new Error('音声変換機能を読み込めませんでした');const {createFFmpeg,fetchFile}=FFmpeg;const ff=createFFmpeg({log:false});setStatus('動画から音声を取り出す準備中…');await ff.load();ff.FS('writeFile','input',await fetchFile(file));setStatus('動画から音声を取り出しています…');await ff.run('-i','input','-vn','-ac','1','-ar','16000','-b:a','64k','audio.mp3');const data=ff.FS('readFile','audio.mp3');return new Blob([data.buffer],{type:'audio/mpeg'})}
$('run').onclick=async()=>{try{const file=$('file').files[0],key=$('key').value.trim();if(!file)throw new Error('先に動画を選んでください');if(!key)throw new Error('OpenAI APIキーを入力してください');$('run').disabled=true;const audio=await extractAudio(file);setStatus('音声を聞き取って字幕タイミングを作っています…');const fd=new FormData();fd.append('file',audio,'audio.mp3');fd.append('model','whisper-1');fd.append('response_format','verbose_json');fd.append('timestamp_granularities[]','segment');const terms=$('terms').value.trim();if(terms)fd.append('prompt','次の固有名詞・専門用語を正しく表記してください: '+terms);const r=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd});if(!r.ok)throw new Error('音声認識エラー: '+await r.text());const j=await r.json();cues=(j.segments||[]).map(x=>({start:x.start,end:x.end,text:(x.text||'').trim()})).filter(x=>x.text);render();setStatus('字幕を生成しました。動画を再生して確認できます。','ok')}catch(e){setStatus(e.message||String(e),'err')}finally{$('run').disabled=false}}
function save(kind){if(!cues.length)return setStatus('先に字幕を生成してください','err');let text;if(kind==='srt')text=cues.map((c,i)=>(i+1)+'\n'+fmt(c.start)+' --> '+fmt(c.end)+'\n'+wrap2(c.text)+'\n').join('\n');else text='WEBVTT\n\n'+cues.map(c=>fmt(c.start,'.')+' --> '+fmt(c.end,'.')+'\n'+wrap2(c.text)+'\n').join('\n');const b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='captions.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('srt').onclick=()=>save('srt');$('vtt').onclick=()=>save('vtt');
</script></body></html>
